<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌾 Tiny Farm</title>
<style>
  :root {
    --wood: #8b5a2b;
    --wood-dark: #5e3c1d;
    --plank: #a9743f;
    --plank-dark: #96662f;
    --cream: #fff6e3;
    --ink: #3d2c1e;
    --gold: #f2b705;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(180deg, #bfe3f7 0%, #d9edc8 55%, #a8d178 100%);
    color: var(--ink);
    padding: 8px;
    height: 100dvh;
    display: flex;
  }
  .game {
    flex: 1;
    max-width: 1500px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }

  /* ---------- Wooden panels ---------- */
  .wood-panel {
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.07) 0 2px, transparent 2px 70px),
      linear-gradient(180deg, #b8834c, var(--plank) 30%, var(--plank-dark));
    border: 4px solid var(--wood-dark);
    border-radius: 14px;
    box-shadow:
      0 4px 0 rgba(62,38,15,0.8),
      0 8px 14px rgba(62,38,15,0.25),
      inset 0 2px 0 rgba(255,255,255,0.3),
      inset 0 -3px 0 rgba(0,0,0,0.15);
    color: var(--cream);
  }

  /* ---------- Compact header ---------- */
  header {
    padding: 5px 12px;
    display: flex;
    align-items: center;
    gap: 8px 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  header h1 { font-size: 1.15rem; text-shadow: 0 2px 0 rgba(0,0,0,0.3); white-space: nowrap; }
  .money {
    font-size: 1.1rem; font-weight: bold; color: var(--ink);
    background: linear-gradient(180deg, #fff2b0, #ffd54f 45%, #f5b81e);
    border: 3px solid #b8860b; border-radius: 999px;
    padding: 2px 14px;
    box-shadow: 0 2px 0 #8d6708, 0 4px 6px rgba(0,0,0,0.2), inset 0 2px 2px rgba(255,255,255,0.8);
    transition: transform 0.15s; white-space: nowrap;
  }
  .money.pop { transform: scale(1.22); }
  .barn-inv { display: flex; gap: 5px; align-items: center; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .barn-inv .item {
    background: linear-gradient(180deg, #fffdf4, #f3e5c0);
    color: var(--ink);
    border: 2px solid var(--wood-dark); border-radius: 8px;
    padding: 1px 6px; font-size: 0.85rem; white-space: nowrap;
    box-shadow: 0 2px 0 rgba(62,38,15,0.6), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .era-tag {
    background: linear-gradient(180deg, #efe0ff, #d9bef5);
    color: #4a1a72;
    border: 2px solid #6a2fa0; border-radius: 999px;
    padding: 2px 12px; font-size: 0.85rem; font-weight: bold; white-space: nowrap;
    box-shadow: 0 2px 0 #4a1a72, inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .era-btn { border-color: #6a2fa0 !important; }
  .reset-btn {
    font-family: inherit; font-size: 1rem; color: var(--cream);
    background: none; border: 2px solid rgba(255,246,227,0.5); border-radius: 8px;
    width: 30px; height: 30px; cursor: pointer; flex-shrink: 0;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.12); }

  /* ============================================================
     THE FARM SCENE — a cartoon-3D world you walk around in
     ============================================================ */
  .scene {
    position: relative;
    flex: 1;
    min-height: 0;
    border: 6px solid var(--wood-dark);
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(180deg, #5db6ec 0%, #8fd0f5 22%, #c3e7fb 38%, #e8f6ff 46%);
    box-shadow: 0 5px 0 rgba(62,38,15,0.8), 0 10px 18px rgba(62,38,15,0.3);
    touch-action: none;
  }

  /* soft sunlight + edge vignette over the whole scene */
  .light {
    position: absolute; inset: 0; z-index: 940; pointer-events: none;
    background:
      radial-gradient(130% 90% at 74% 8%, rgba(255,246,190,0.22), transparent 55%),
      radial-gradient(145% 125% at 50% 55%, transparent 62%, rgba(40,20,5,0.18) 100%);
  }

  /* ------- weather overlays ------- */
  .wx { position: absolute; inset: 0; z-index: 935; pointer-events: none; }
  .wx.rain {
    background-color: rgba(70,110,160,0.12);
    background-image: repeating-linear-gradient(78deg,
      rgba(200,230,255,0.4) 0 2px, transparent 2px 18px);
    animation: rainfall 0.55s linear infinite;
  }
  .wx.storm {
    background-color: rgba(30,45,80,0.3);
    background-image: repeating-linear-gradient(75deg,
      rgba(200,230,255,0.5) 0 2.5px, transparent 2.5px 12px);
    animation: rainfall 0.32s linear infinite;
  }
  .wx.storm::after {
    content: ""; position: absolute; inset: 0; background: #fff; opacity: 0;
    animation: lightning 6.5s infinite;
  }
  @keyframes rainfall { from { background-position: 0 0; } to { background-position: -28px 130px; } }
  @keyframes lightning {
    0%, 93.9%, 96.4%, 100% { opacity: 0; }
    94.3% { opacity: 0.55; }
    94.9% { opacity: 0.05; }
    95.4% { opacity: 0.4; }
  }
  .wx.drought {
    background:
      radial-gradient(120% 80% at 70% 10%, rgba(255,190,80,0.24), transparent 60%),
      linear-gradient(180deg, rgba(255,170,60,0.16), rgba(255,120,20,0.1));
  }
  .wx.snow {
    background-color: rgba(205,230,255,0.18);
    background-image:
      radial-gradient(3px 3px at 22px 28px, #fff 45%, transparent 60%),
      radial-gradient(2px 2px at 75px 82px, #fff 45%, transparent 60%),
      radial-gradient(2.5px 2.5px at 128px 45px, #fff 45%, transparent 60%),
      radial-gradient(2px 2px at 50px 120px, #fff 45%, transparent 60%);
    background-size: 160px 160px;
    animation: snowfall 4s linear infinite;
  }
  @keyframes snowfall {
    from { background-position: 0 -160px, 30px -160px, 60px -160px, 90px -160px; }
    to   { background-position: 34px 160px, 10px 160px, 100px 160px, 70px 160px; }
  }
  .wxbadge {
    position: absolute; top: 10px; left: 10px; z-index: 1002;
    pointer-events: none;
    background: linear-gradient(180deg, #b8834c, var(--plank-dark));
    border: 3px solid var(--wood-dark); border-radius: 10px;
    color: var(--cream); font-weight: bold; font-size: 0.85rem;
    padding: 4px 10px;
    box-shadow: 0 3px 0 rgba(62,38,15,0.7), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .wxbadge .wxnext {
    font-weight: normal; font-size: 0.72rem; opacity: 0.95; margin-left: 4px;
  }
  .seasonbadge {
    position: absolute; top: 48px; left: 10px; z-index: 1002;
    pointer-events: none;
    background: linear-gradient(180deg, #b8834c, var(--plank-dark));
    border: 3px solid var(--wood-dark); border-radius: 10px;
    color: var(--cream); font-weight: bold; font-size: 0.75rem;
    padding: 3px 9px;
    box-shadow: 0 3px 0 rgba(62,38,15,0.7), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  /* plants / animals view toggle */
  .view-toggle {
    position: absolute; top: 82px; left: 10px; z-index: 1003;
    display: flex; border-radius: 10px; overflow: hidden;
    border: 3px solid var(--wood-dark);
    box-shadow: 0 3px 0 rgba(62,38,15,0.7);
  }
  .vt-btn {
    font-family: inherit; cursor: pointer; border: none;
    background: linear-gradient(180deg, #b8834c, var(--plank-dark));
    color: var(--cream); font-weight: bold; font-size: 0.72rem;
    padding: 4px 8px;
  }
  .vt-btn + .vt-btn { border-left: 2px solid var(--wood-dark); }
  .vt-btn.active {
    background: linear-gradient(180deg, #ffe082, #f5b81e);
    color: var(--ink);
  }

  /* market demand board — always one tap away */
  .mkt-btn {
    position: absolute; top: 116px; left: 10px; z-index: 1003;
    font-family: inherit; cursor: pointer;
    background: linear-gradient(180deg, #b8834c, var(--plank-dark));
    border: 3px solid var(--wood-dark); border-radius: 10px;
    color: var(--cream); font-weight: bold; font-size: 0.75rem;
    padding: 3px 9px;
    box-shadow: 0 3px 0 rgba(62,38,15,0.7), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.1s;
  }
  .mkt-btn:hover { transform: scale(1.05); }
  .mkt-btn.open { background: linear-gradient(180deg, #ffe082, #f5b81e); color: var(--ink); border-color: #8d6708; }
  .mkt-panel {
    position: absolute; top: 150px; left: 10px; z-index: 1003;
    width: 218px; max-height: calc(100% - 162px);
    overflow-y: auto;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 60px),
      linear-gradient(180deg, #b8834c, var(--plank-dark));
    border: 3px solid var(--wood-dark); border-radius: 12px;
    padding: 8px;
    box-shadow: 0 5px 0 rgba(62,38,15,0.7), 0 8px 14px rgba(0,0,0,0.3);
    color: var(--cream);
  }
  .mkt-panel h3 {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
    text-align: center; margin-bottom: 6px; text-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  .mkt-row {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,246,227,0.92); color: var(--ink);
    border-radius: 8px; padding: 3px 8px; margin-bottom: 4px;
    font-size: 0.78rem;
  }
  .mkt-row.locked { opacity: 0.55; }
  .mkt-row .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mkt-row b { font-size: 0.74rem; white-space: nowrap; }
  .mkt-row .pr { font-weight: bold; white-space: nowrap; }
  .mkt-note { font-size: 0.66rem; text-align: center; opacity: 0.9; margin-top: 2px; line-height: 1.4; }

  /* chicken coop panel */
  .coop-panel { width: 236px; }
  .coop-row {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,246,227,0.92); color: var(--ink);
    border-radius: 8px; padding: 4px 7px; margin-bottom: 4px;
    font-size: 0.76rem;
  }
  .coop-row .cn { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .coop-row .cn small { display: block; font-size: 0.64rem; color: #6d5b45; }
  .coop-row button {
    font-family: inherit; font-size: 0.68rem; font-weight: bold; color: var(--ink);
    background: linear-gradient(180deg, #ffe082, #ffca28);
    border: 2px solid #b8860b; border-radius: 7px;
    padding: 3px 6px; cursor: pointer; white-space: nowrap;
  }
  .coop-row button.outb {
    background: linear-gradient(180deg, #c5e1a5, #9ccc65);
    border-color: #558b2f;
  }
  .coop-buy {
    width: 100%; font-family: inherit; font-size: 0.78rem; font-weight: bold; color: var(--cream);
    background: linear-gradient(180deg, #c08c50, #8a5c2c);
    border: 2px solid var(--wood-dark); border-radius: 8px;
    padding: 5px; cursor: pointer; margin-bottom: 4px;
  }
  .coop-buy:disabled { filter: grayscale(0.8); opacity: 0.6; cursor: not-allowed; }

  /* the coop hut and your hens in the world */
  .coop {
    position: absolute; left: 5.5%; top: 50%; width: 66px; height: 54px; z-index: 3;
    filter: drop-shadow(0 4px 3px rgba(20,40,10,0.25));
  }
  .coop .croof {
    position: absolute; top: 0; left: -4px; right: -4px; height: 24px;
    background: linear-gradient(180deg, #8d5b33, #6d4322);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .coop .cbase {
    position: absolute; bottom: 0; left: 4px; right: 4px; height: 32px;
    background: linear-gradient(180deg, #b07c46, #8a5c2c);
    border: 3px solid var(--wood-dark); border-radius: 0 0 5px 5px;
  }
  .coop .chole {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 16px; height: 20px; background: #3d2812;
    border-radius: 50% 50% 0 0;
  }
  .chick { position: absolute; pointer-events: none; }
  .chick .chsvg { display: block; width: 30px; height: auto; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.28)); }
  .chick .ctag {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; line-height: 1;
    animation: ailPulse 0.9s ease-in-out infinite alternate;
  }

  /* ---- real bird movement: scissor legs, bobbing head ---- */
  .ch-legL, .ch-legR, .ch-head, .ch-body,
  .cr-legL, .cr-legR, .cr-head, .cr-body { transform-box: fill-box; }
  .ch-legL, .ch-legR, .cr-legL, .cr-legR { transform-origin: 50% 8%; }
  .ch-head, .cr-head { transform-origin: 25% 85%; }
  .chick.moving .ch-legL { animation: birdStep 0.26s ease-in-out infinite alternate; }
  .chick.moving .ch-legR { animation: birdStep 0.26s ease-in-out infinite alternate-reverse; }
  .chick.moving .ch-head { animation: birdHeadWalk 0.26s ease-in-out infinite alternate; }
  .chick.moving .ch-body { animation: birdBodyWalk 0.26s ease-in-out infinite alternate; }
  .chick:not(.moving) .ch-head { animation: birdPeckIdle 2.8s ease-in-out infinite; }
  @keyframes birdStep { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  @keyframes birdHeadWalk { from { transform: translateX(-1px); } to { transform: translateX(2.4px); } }
  @keyframes birdBodyWalk { from { transform: translateY(0); } to { transform: translateY(-1.1px); } }
  @keyframes birdPeckIdle {
    0%, 58%, 100% { transform: none; }
    68%, 84% { transform: rotate(30deg) translate(1px, 2px); }
    76% { transform: rotate(14deg); }
  }
  .chick.starving .ctag {
    animation: ailPanic 0.3s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 5px rgba(244,67,54,0.95));
  }

  /* the beehive and its bees */
  .hive {
    position: absolute; left: 12%; top: 52.5%; width: 38px; height: 44px; z-index: 3;
    filter: drop-shadow(0 4px 3px rgba(20,40,10,0.25));
  }
  .hive .hroof {
    position: absolute; top: 0; left: -4px; right: -4px; height: 9px;
    background: linear-gradient(180deg, #8d5b33, #6d4322);
    border-radius: 4px 4px 0 0;
  }
  .hive .hbox {
    position: absolute; top: 8px; left: 0; right: 0; bottom: 0;
    background:
      repeating-linear-gradient(180deg, #f2c14e 0 8px, #d99e2b 8px 11px),
      #f2c14e;
    border: 2px solid #9c6a1f; border-radius: 4px 4px 6px 6px;
  }
  .hive .hhole {
    position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
    width: 9px; height: 9px; background: #4a2f10; border-radius: 50%;
  }
  .hive .htag {
    position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
    font-size: 12px; line-height: 1;
    animation: ailPulse 0.9s ease-in-out infinite alternate;
  }
  .bee {
    position: absolute; pointer-events: none;
    font-size: 13px; line-height: 1;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.25));
  }
  .chick .cshadow {
    position: absolute; left: 50%; bottom: -2px;
    width: 22px; height: 7px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.25), rgba(0,0,0,0) 70%);
    border-radius: 50%;
  }

  /* the crow: a black menace, nothing like your hens */
  .crow { position: absolute; pointer-events: none; }
  .crow svg { display: block; width: 40px; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.35)); }
  .crow.walking .cr-legL { animation: birdStep 0.3s ease-in-out infinite alternate; }
  .crow.walking .cr-legR { animation: birdStep 0.3s ease-in-out infinite alternate-reverse; }
  .crow.walking .cr-head { animation: birdHeadWalk 0.3s ease-in-out infinite alternate; }
  .crow.walking .cr-body { animation: birdBodyWalk 0.3s ease-in-out infinite alternate; }
  .crow.ground:not(.walking) .cr-head { animation: birdPeckIdle 1.5s ease-in-out infinite; }
  .crow.flying svg, .crow.fleeing svg { animation: crowFlap 0.22s ease-in-out infinite alternate; }
  .crow.flying .cr-legL, .crow.flying .cr-legR,
  .crow.fleeing .cr-legL, .crow.fleeing .cr-legR { transform: rotate(38deg); }
  @keyframes crowFlap { from { transform: translateY(0) scaleY(1); } to { transform: translateY(-5px) scaleY(0.9); } }
  .crow .crshadow {
    display: none;
    position: absolute; left: 50%; bottom: -2px;
    width: 26px; height: 8px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.3), rgba(0,0,0,0) 70%);
    border-radius: 50%;
  }
  .crow.ground .crshadow { display: block; }
  .crow .stolen { position: absolute; top: 20px; left: -8px; font-size: 16px; line-height: 1; }

  /* the land itself changes with the season */
  .scene.season-summer .grass { filter: hue-rotate(-9deg) saturate(1.05); }
  .scene.season-summer .hill { filter: hue-rotate(-9deg) saturate(1.05); }
  .scene.season-autumn .grass { filter: sepia(0.3) hue-rotate(-14deg) saturate(1.15); }
  .scene.season-autumn .hill { filter: sepia(0.35) hue-rotate(-16deg) saturate(1.15); }
  .scene.season-autumn .tree { filter: hue-rotate(-55deg) saturate(1.3) brightness(1.02) drop-shadow(0 5px 4px rgba(60,30,10,0.25)); }
  .scene.season-winter .grass { filter: saturate(0.4) brightness(1.14) hue-rotate(14deg); }
  .scene.season-winter .hill { filter: saturate(0.4) brightness(1.16) hue-rotate(14deg); }
  .scene.season-winter .tree { filter: saturate(0.35) brightness(1.18) drop-shadow(0 5px 4px rgba(40,50,70,0.25)); }

  /* extreme weather overlays */
  .wx.heatwave {
    background:
      radial-gradient(130% 90% at 70% 8%, rgba(255,120,40,0.32), transparent 62%),
      linear-gradient(180deg, rgba(255,140,30,0.24), rgba(230,70,10,0.16));
    animation: heatThrob 1.6s ease-in-out infinite alternate;
  }
  @keyframes heatThrob { from { opacity: 0.85; } to { opacity: 1; } }
  .wx.blizzard {
    background-color: rgba(210,230,250,0.42);
    background-image:
      radial-gradient(3.5px 3.5px at 22px 28px, #fff 45%, transparent 60%),
      radial-gradient(2.5px 2.5px at 75px 82px, #fff 45%, transparent 60%),
      radial-gradient(3px 3px at 128px 45px, #fff 45%, transparent 60%),
      radial-gradient(2.5px 2.5px at 50px 120px, #fff 45%, transparent 60%),
      radial-gradient(2px 2px at 100px 100px, #fff 45%, transparent 60%);
    background-size: 140px 140px;
    animation: blizzardfall 1.3s linear infinite;
  }
  @keyframes blizzardfall {
    from { background-position: 0 -140px, 30px -140px, 60px -140px, 90px -140px, 120px -140px; }
    to   { background-position: 90px 140px, 120px 140px, 30px 140px, 150px 140px, 60px 140px; }
  }

  /* sun with slowly turning rays */
  .sun {
    position: absolute; top: 4%; right: 6%;
    width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #fffcd8 20%, #ffe066 55%, #ffc93d 75%);
    box-shadow: 0 0 46px 20px rgba(255,230,120,0.6), inset -4px -6px 10px rgba(240,160,20,0.45);
    animation: sunPulse 4s ease-in-out infinite alternate;
  }
  .sun::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255,238,140,0.28) 0 9deg, transparent 9deg 30deg);
    -webkit-mask: radial-gradient(circle, transparent 36%, #000 38%, #000 62%, transparent 65%);
    mask: radial-gradient(circle, transparent 36%, #000 38%, #000 62%, transparent 65%);
    animation: sunSpin 46s linear infinite;
  }
  @keyframes sunSpin { to { transform: rotate(360deg); } }
  @keyframes sunPulse { from { transform: scale(1); } to { transform: scale(1.07); } }

  /* puffy 3D clouds */
  .cloud {
    position: absolute; width: 88px; height: 30px;
    background: linear-gradient(180deg, #ffffff 40%, #e3f0f9);
    border-radius: 30px;
    box-shadow: 0 5px 8px rgba(110,150,190,0.25), inset 0 -6px 8px rgba(180,205,225,0.5);
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
    box-shadow: inset 0 -5px 7px rgba(180,205,225,0.4);
  }
  .cloud::before { left: 14px; top: -16px; width: 36px; height: 32px; }
  .cloud::after { left: 42px; top: -11px; width: 27px; height: 25px; }
  .cloud.c1 { top: 6%; animation: drift 70s linear infinite; }
  .cloud.c2 { top: 16%; transform: scale(0.65); animation: drift 95s linear infinite; animation-delay: -40s; }
  .cloud.c3 { top: 2%; transform: scale(0.5); animation: drift 120s linear infinite; animation-delay: -70s; }
  @keyframes drift { from { left: -110px; } to { left: 105%; } }

  /* rolling hills with sunlit tops */
  .hill { position: absolute; border-radius: 50%; }
  .hill.h1 {
    left: -18%; top: 25%; width: 75%; height: 22%;
    background: radial-gradient(ellipse at 50% 12%, #97c465 0%, #79ad4c 55%, #63944a 100%);
  }
  .hill.h2 {
    right: -22%; top: 23%; width: 85%; height: 26%;
    background: radial-gradient(ellipse at 50% 12%, #8dbb58 0%, #6da23e 55%, #5a8c3c 100%);
  }
  .hill.h3 {
    left: 28%; top: 28%; width: 66%; height: 18%;
    background: radial-gradient(ellipse at 50% 12%, #a0cc6c 0%, #82b656 55%, #6d9e4a 100%);
  }
  /* hazy air where the land meets the sky */
  .haze {
    position: absolute; left: 0; right: 0; top: 30%; height: 14%;
    background: linear-gradient(180deg, rgba(232,246,255,0), rgba(240,250,240,0.5), rgba(240,250,240,0));
    z-index: 2; pointer-events: none;
  }

  /* the meadow — lit like a rolling lawn */
  .grass {
    position: absolute; left: 0; right: 0; top: 35%; bottom: 0;
    background:
      radial-gradient(120% 55% at 62% 12%, rgba(255,255,200,0.22), transparent 60%),
      repeating-linear-gradient(100deg, rgba(255,255,255,0.05) 0 70px, transparent 70px 140px),
      linear-gradient(180deg, #679c3a 0%, #79b046 20%, #88bd52 55%, #94c65c 100%);
  }

  .tree { position: absolute; z-index: 2; filter: drop-shadow(0 5px 4px rgba(20,40,10,0.25)); }
  .tree svg { display: block; width: 100%; height: auto; }

  /* the barn — front face plus a shaded side wall for depth */
  .barn { position: absolute; left: 3.5%; top: 18%; width: 152px; height: 96px; z-index: 2; filter: drop-shadow(0 6px 5px rgba(20,40,10,0.28)); }
  .barn .side {
    position: absolute; bottom: 0; left: 124px; width: 22px; height: 58px;
    background: linear-gradient(90deg, #a33823, #8c2f1d);
    border: 3px solid #6d2013; border-left: none;
    transform: skewY(-16deg); transform-origin: left bottom;
    border-radius: 0 4px 4px 0;
  }
  .barn .roofside {
    position: absolute; bottom: 52px; left: 66px; width: 84px; height: 46px;
    background: linear-gradient(90deg, #6d2a1c, #5c2315);
    clip-path: polygon(0% 0%, 79% 55%, 79% 100%, 0% 45%);
  }
  .barn .body {
    position: absolute; bottom: 0; left: 8px; width: 116px; height: 58px;
    background: linear-gradient(180deg, #e8604a 0%, #d94f37 40%, #b93b24 100%);
    border: 3px solid #7e2517; border-top: none; border-radius: 0 0 6px 6px;
  }
  .barn .body::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 9px;
    background: linear-gradient(180deg, rgba(60,10,0,0.35), transparent);
  }
  .barn .roof {
    position: absolute; bottom: 52px; left: 0; width: 132px; height: 42px;
    background: linear-gradient(180deg, #a34b36 0%, #8d3b2b 50%, #722c1c 100%);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .barn .door {
    position: absolute; bottom: 3px; left: 46px; width: 40px; height: 40px;
    background: linear-gradient(180deg, #fdf3da, #ecd9b0);
    border: 3px solid #7e2517; border-radius: 6px 6px 0 0;
    box-shadow: inset 0 3px 5px rgba(120,60,20,0.35);
  }
  .barn .door::before, .barn .door::after {
    content: ""; position: absolute; top: -2px; left: 15px; width: 4px; height: 38px;
    background: #7e2517; transform: rotate(45deg);
  }
  .barn .door::after { transform: rotate(-45deg); }
  .barn .loft {
    position: absolute; bottom: 62px; left: 56px; width: 20px; height: 16px;
    background: #fdf3da; border: 3px solid #7e2517; border-radius: 50% 50% 0 0; z-index: 1;
  }
  .tractor { position: absolute; left: 15%; top: 28%; font-size: 30px; z-index: 2; transform: scaleX(-1); filter: drop-shadow(0 3px 3px rgba(0,0,0,0.25)); display: none; }

  /* ============ the look of each age ============ */
  /* Stone & Bronze: a hide tent instead of a barn */
  .tent {
    position: absolute; left: 5%; top: 22%; width: 108px; height: 82px; z-index: 2;
    display: none; filter: drop-shadow(0 5px 4px rgba(20,40,10,0.25));
  }
  .tent .tcloth {
    position: absolute; inset: 0;
    background: linear-gradient(115deg, #cda36c 0%, #b0854c 55%, #8f6a3a 100%);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .tent .tstreak {
    position: absolute; bottom: 0; width: 3px; background: rgba(90,60,25,0.4);
  }
  .tent .tstreak.s1 { left: 32%; height: 62%; transform: rotate(14deg); }
  .tent .tstreak.s2 { left: 62%; height: 62%; transform: rotate(-14deg); }
  .tent .tdoor {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 30px; height: 38px; background: #46301a;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .tent .tpole {
    position: absolute; top: -10px; left: 50%; width: 4px; height: 26px;
    background: #6d4f2c; border-radius: 2px;
  }
  .tent .tpole.p1 { transform: rotate(24deg); }
  .tent .tpole.p2 { transform: rotate(-24deg); }
  .scene.era-0 .tent, .scene.era-1 .tent { display: block; }
  .scene.era-0 .barn, .scene.era-1 .barn { display: none; }
  .scene.era-0 .fence { display: none; }         /* fences haven't been invented */
  .scene.era-5 .tractor { display: block; }      /* tractors are strictly modern */

  /* Iron & Medieval: a timber barn (thatched roof in medieval times) */
  .scene.era-2 .barn .body, .scene.era-3 .barn .body {
    background: linear-gradient(180deg, #ab8146 0%, #966f39 40%, #7d5a2b 100%);
    border-color: #54391a;
  }
  .scene.era-2 .barn .roof { background: linear-gradient(180deg, #7d5f38, #64492a 50%, #503a20 100%); }
  .scene.era-2 .barn .roofside { background: linear-gradient(90deg, #4d3820, #3f2e19); }
  .scene.era-3 .barn .roof { background: linear-gradient(180deg, #cbaa52 0%, #b0913e 50%, #8f7430 100%); }
  .scene.era-3 .barn .roofside { background: linear-gradient(90deg, #8a7130, #6f5b26); }
  .scene.era-2 .barn .side, .scene.era-3 .barn .side {
    background: linear-gradient(90deg, #8a6535, #6f501f);
    border-color: #54391a;
  }
  .scene.era-2 .barn .door::before, .scene.era-2 .barn .door::after,
  .scene.era-3 .barn .door::before, .scene.era-3 .barn .door::after { background: #54391a; }
  .scene.era-2 .barn .door, .scene.era-2 .barn .loft,
  .scene.era-3 .barn .door, .scene.era-3 .barn .loft { border-color: #54391a; }

  /* the market stand through the ages: stone slab -> plain cloth -> stripes */
  .scene.era-0 .stand .awning, .scene.era-0 .stand .aside,
  .scene.era-1 .stand .awning, .scene.era-1 .stand .aside { display: none; }
  .scene.era-0 .stand .counter {
    background: linear-gradient(180deg, #c4bcae 0%, #a49c8d 45%, #837b6d 100%);
    border-color: #57524a;
  }
  .scene.era-0 .stand .legL, .scene.era-0 .stand .legR { background: #837b6d; border-color: #57524a; }
  .scene.era-0 .stand .cside { background: linear-gradient(90deg, #767065, #5f5a50); border-color: #57524a; }
  .scene.era-2 .stand .awning, .scene.era-3 .stand .awning {
    background: linear-gradient(180deg, rgba(255,255,255,0.28), transparent 45%, rgba(80,40,0,0.18)), #c9b18a;
  }
  .scene.era-2 .stand .awning::after, .scene.era-3 .stand .awning::after { background: #b89f74; }
  .scene.era-2 .stand .aside, .scene.era-3 .stand .aside { background: linear-gradient(90deg, #b09a6f, #93805c); }

  /* the farmer's clothes evolve with the times */
  .scene.era-0 .f-hat, .scene.era-1 .f-hat, .scene.era-2 .f-hat { display: none; }
  .scene.era-0 .f-hair, .scene.era-1 .f-hair, .scene.era-2 .f-hair { display: inline; }
  .scene.era-0 .f-shirt { fill: #8a6a45; }   /* rough fur */
  .scene.era-0 .f-ovr { fill: #6d4f2f; }
  .scene.era-0 .f-pocket { fill: #5c4227; stroke: #46311c; }
  .scene.era-0 .f-blade { fill: #9b958b; stroke: #6e6960; }   /* a flint edge */
  .scene.era-1 .f-shirt { fill: #c98a4b; }   /* woven tunic */
  .scene.era-1 .f-ovr { fill: #8a5a33; }
  .scene.era-1 .f-pocket { fill: #7a4d29; stroke: #5e3a1e; }
  .scene.era-1 .f-blade { fill: #c98f4f; stroke: #94682f; }   /* bronze */
  .scene.era-2 .f-shirt { fill: #8a9096; }   /* iron-grey cloth */
  .scene.era-2 .f-ovr { fill: #5a5750; }
  .scene.era-2 .f-pocket { fill: #4c4a45; stroke: #3a3835; }
  .scene.era-3 .f-hat { fill: #7a5228; }     /* a brown peasant hood */
  .scene.era-3 .f-hatband { stroke: #5e3a1e; }
  .scene.era-3 .f-shirt { fill: #5d8a3c; }   /* medieval green tunic */
  .scene.era-3 .f-ovr { fill: #6d4620; }
  .scene.era-3 .f-pocket { fill: #5c3a1c; stroke: #46311c; }
  .scene.era-4 .f-hat { fill: #6b7076; }     /* an industrial flat cap */
  .scene.era-4 .f-hatband { stroke: #4c5055; }
  .scene.era-4 .f-shirt { fill: #d9d4c8; }
  .scene.era-4 .f-ovr { fill: #3f5f8f; }
  .chicken { position: absolute; left: 6%; top: 50%; font-size: 24px; z-index: 3; animation: peck 2.6s ease-in-out infinite; transform-origin: bottom center; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.25)); }
  @keyframes peck {
    0%, 55%, 100% { transform: rotate(0deg); }
    62%, 76% { transform: rotate(24deg) translateY(3px); }
    69% { transform: rotate(10deg); }
  }
  .flower { position: absolute; z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }

  /* the field — a raised bed of tilled earth in perspective */
  .field-layer { position: absolute; left: 10%; width: 68%; top: 40%; height: 55%; }
  .field-dirt { clip-path: polygon(17% 0%, 83% 0%, 98% 100%, 2% 100%); }
  .soil {
    position: absolute; left: 0; right: 0; bottom: 11px;
    background:
      linear-gradient(180deg, rgba(255,238,190,0.16), transparent 30%, rgba(35,15,0,0.16)),
      repeating-linear-gradient(180deg,
        #93613a 0px, #7d4f2c 11px,
        #5c3a20 15px,
        #7d4f2c 19px, #8a5a33 27px);
    border-radius: 45% 45% 0 0 / 26px;
    box-shadow: inset 0 12px 20px rgba(46,28,12,0.55), inset 0 -6px 12px rgba(46,28,12,0.3);
    border-top: 5px solid #a3714a;
    transition: top 0.7s ease;
  }
  /* the earthy front edge of the raised bed */
  .soil::after {
    content: ""; position: absolute; left: -1%; right: -1%; bottom: -12px; height: 14px;
    background: linear-gradient(180deg, #6b4526, #4a2e18);
    border-radius: 0 0 16px 16px;
    box-shadow: inset 0 3px 3px rgba(255,220,160,0.15);
  }
  .fence {
    position: absolute; left: -1%; right: -1%; bottom: -5%; height: 27px; z-index: 970;
    background: repeating-linear-gradient(90deg,
      #a06b35 0 3px, #855426 3px 6px, #6f4522 6px 8px, transparent 8px 48px);
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.28));
    pointer-events: none;
  }
  .fence::before, .fence::after {
    content: ""; position: absolute; left: 0; right: 0; height: 6px;
    background: linear-gradient(180deg, #b07c46, #8a5a2b 60%, #6f4522);
    border-radius: 3px;
  }
  .fence::before { top: 5px; }
  .fence::after { top: 16px; }

  /* planting spots — dirt mounds with volume */
  .spot { position: absolute; width: 0; height: 0; cursor: pointer; }
  .spot.hidden { display: none; }
  .spot .mound {
    position: absolute; border-radius: 50%;
    background: radial-gradient(ellipse at 42% 28%,
      #8a5f36 0%, #6b4523 38%, #4a2f18 60%, rgba(74,47,24,0) 74%);
    transition: box-shadow 0.15s;
  }
  .spot.near .mound, .spot.stage-empty:hover .mound {
    background: radial-gradient(ellipse at 42% 28%,
      #9a6c3f 0%, #7a512a 38%, #543619 60%, rgba(74,47,24,0) 74%);
    box-shadow: 0 0 0 3px rgba(255,235,59,0.75);
  }
  .spot.locked .mound { display: none; }
  /* watered soil: dark and damp, with a drop over the plant */
  .spot.wet .mound {
    background: radial-gradient(ellipse at 42% 28%,
      #5d4028 0%, #46311c 38%, #2f2011 60%, rgba(47,32,17,0) 74%);
  }
  .spot.wet .sprite::before {
    content: "💧"; position: absolute; top: -12px; left: 24px; font-size: 12px;
    animation: dripFade 1.6s ease-in-out infinite;
  }
  @keyframes dripFade {
    0% { opacity: 0; transform: translateY(-4px); }
    40% { opacity: 1; }
    100% { opacity: 0; transform: translateY(4px); }
  }
  /* plants in trouble: growth is paused until the farmer helps */
  .ailtag {
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    line-height: 1; z-index: 2;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
    animation: ailPulse 0.9s ease-in-out infinite alternate;
  }
  @keyframes ailPulse { from { transform: translateX(-50%) scale(0.9); } to { transform: translateX(-50%) scale(1.15); } }
  .spot.ail-soggy .mound {
    background: radial-gradient(ellipse at 45% 35%,
      rgba(90,150,225,0.8) 0%, rgba(65,115,195,0.55) 48%, rgba(74,47,24,0) 74%);
  }
  .spot.ail-wilt .plantbox { filter: saturate(0.3) sepia(0.45) brightness(0.95); }
  .spot.ail-frozen .plantbox { filter: saturate(0.45) hue-rotate(150deg) brightness(1.15); }
  .spot.ail-wilt .bar span, .spot.ail-soggy .bar span, .spot.ail-frozen .bar span {
    background: linear-gradient(180deg, #ffab5e, #ef6c00);
  }
  /* out-of-season plants sleep until their season comes back around */
  .spot.dormant .plantbox { filter: grayscale(0.65) brightness(0.92); }
  .spot.dormant .bar span { background: linear-gradient(180deg, #b0bec5, #78909c); }
  /* tired soil (same crop twice in a row): slow growth, brown bar */
  .spot.tired .bar span { background: linear-gradient(180deg, #d7a86e, #a1743f); }
  /* a plant on the brink of death flashes its warning urgently */
  .spot.dying .ailtag {
    animation: ailPanic 0.3s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 5px rgba(244,67,54,0.95));
  }
  @keyframes ailPanic {
    from { transform: translateX(-50%) scale(0.95); }
    to { transform: translateX(-50%) scale(1.35); }
  }
  /* dead plants: a withered husk to sweep away */
  .spot.dead .weed-glyph { filter: saturate(0.25) brightness(0.8); }
  .spot.dead .mound {
    background: radial-gradient(ellipse at 42% 28%,
      #4a3520 0%, #382818 45%, rgba(40,28,15,0) 74%);
  }
  .spot.dead.near .weed-glyph { text-shadow: 0 0 8px rgba(255,235,59,0.9); }
  .spot.locked.near .weed-glyph { text-shadow: 0 0 8px rgba(255,235,59,0.9); }
  .sprite {
    position: absolute; left: 0; bottom: -4px; width: 110px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
  }
  .weed-glyph { line-height: 1.05; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.28)); }
  .bar {
    display: none; height: 7px; margin-bottom: 4px;
    background: rgba(30,20,5,0.5); border-radius: 4px; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.25);
  }
  .spot.growing .bar { display: block; }
  .bar span { display: block; height: 100%; background: linear-gradient(180deg, #d4ff4d, #9ccc1a); border-radius: 4px; }

  /* ------- growing plants with rounded, shaded parts ------- */
  .plant {
    position: relative;
    transform-origin: bottom center;
    transition: transform 0.45s linear;
    pointer-events: auto;
  }
  .plant .sway { position: absolute; inset: 0; transform-origin: bottom center; }
  .spot.ready .plant .sway { animation: sway 2.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  .plant.shake .sway { animation: shake 0.3s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-7deg) translateX(-2px); }
    65% { transform: rotate(6deg) translateX(2px); }
  }
  .stem {
    position: absolute; bottom: 0;
    transform-origin: bottom center;
    border-radius: 45% 45% 0 0 / 60% 60% 0 0;
    background: linear-gradient(90deg, #a5d16f, #7cb342 45%, #4a7a26);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.22));
  }
  .plant.ripe-gold .stem { background: linear-gradient(90deg, #f6e29a, #e0bd55 45%, #a87e28); }
  .stem.stake { background: linear-gradient(90deg, #bd9058, #a97a4a 45%, #6d4620); border-radius: 2px; }
  .leafball {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 33% 28%, #a2de74, #6cb03c 55%, #47822a 85%);
    box-shadow: inset -4px -5px 8px rgba(20,70,10,0.4), inset 3px 4px 6px rgba(255,255,215,0.3);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.2));
  }
  .cornleaf {
    position: absolute; bottom: 0;
    width: 16px; height: 30px;
    background: linear-gradient(120deg, #85c453, #5f9e34 60%, #47822a);
    border-radius: 0 100% 0 100%;
    transform-origin: bottom right;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.18));
  }
  .cornleaf.flip { border-radius: 100% 0 100% 0; transform-origin: bottom left; }
  .fruit {
    position: absolute; transform: translateX(-50%) scale(0);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.3));
    line-height: 1;
  }
  .plant.fruited .fruit { transform: translateX(-50%) scale(1); }
  .spot.ready .sprite::after {
    content: "✨"; position: absolute; top: -14px; right: 22px; font-size: 15px;
    animation: twinkle 1s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.4; transform: scale(0.8); } to { opacity: 1; transform: scale(1.15); } }
  /* rare and better crops glow when ready to harvest */
  .spot.ready.r-rare .plantbox      { filter: drop-shadow(0 0 5px rgba(66,165,245,0.75)); }
  .spot.ready.r-epic .plantbox      { filter: drop-shadow(0 0 6px rgba(192,92,224,0.85)); }
  .spot.ready.r-legendary .plantbox { filter: drop-shadow(0 0 8px rgba(255,179,0,0.95)); animation: legendGlow 1.4s ease-in-out infinite alternate; }
  @keyframes legendGlow {
    from { filter: drop-shadow(0 0 5px rgba(255,179,0,0.7)); }
    to   { filter: drop-shadow(0 0 11px rgba(255,200,40,1)); }
  }

  /* crop falling when chopped */
  .chopped {
    position: absolute; z-index: 980; pointer-events: none;
    transform-origin: bottom center; line-height: 1;
    animation: chopfall 0.65s ease-in forwards;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.3));
  }
  @keyframes chopfall {
    0% { transform: translateX(-50%) rotate(0deg); opacity: 1; }
    55% { transform: translateX(-50%) rotate(78deg); opacity: 1; }
    100% { transform: translateX(-50%) rotate(84deg) translateY(6px); opacity: 0; }
  }

  /* ------- the farmer: a proper cartoon character ------- */
  #farmer { position: absolute; pointer-events: none; }
  #farmer .fshadow {
    position: absolute; left: 50%; bottom: -3px;
    width: 40px; height: 12px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.32), rgba(0,0,0,0) 70%);
    border-radius: 50%;
  }
  .fsvg { display: block; width: 58px; height: auto; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.28)); }
  .fsvg .legL, .fsvg .legR, .fsvg .armL, .fsvg .armR { transform-box: fill-box; }
  .fsvg .legL, .fsvg .legR { transform-origin: 50% 8%; }
  .fsvg .armL, .fsvg .armR { transform-origin: 50% 12%; }
  #farmer.walking .fsvg { animation: hop 0.28s ease-in-out infinite alternate; }
  #farmer.walking .legL { animation: swing 0.28s ease-in-out infinite alternate; }
  #farmer.walking .legR { animation: swing 0.28s ease-in-out infinite alternate-reverse; }
  #farmer.walking .armL { animation: swing 0.28s ease-in-out infinite alternate-reverse; }
  #farmer.walking .armR { animation: armswing 0.28s ease-in-out infinite alternate; }
  @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  @keyframes swing { from { transform: rotate(-17deg); } to { transform: rotate(17deg); } }
  @keyframes armswing { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  #farmer.chopping .armR { animation: chopswing 0.32s ease-in-out; }
  @keyframes chopswing {
    0% { transform: rotate(-120deg); }
    55% { transform: rotate(28deg); }
    100% { transform: rotate(8deg); }
  }

  /* ------- the market stand: shaded wood + scalloped awning ------- */
  .stand { position: absolute; left: 91%; top: 52%; width: 110px; height: 88px; transform: translate(-50%, -100%); z-index: 520; pointer-events: none; filter: drop-shadow(0 5px 4px rgba(20,40,10,0.28)); }
  .stand .awning {
    position: absolute; top: 0; left: 0; right: 6px; height: 30px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.3), transparent 45%, rgba(80,10,0,0.18)),
      repeating-linear-gradient(90deg, #e53935 0 16px, #fdfdfd 16px 32px);
    border: 3px solid var(--wood-dark); border-radius: 10px 10px 4px 4px;
  }
  .stand .awning::after {
    content: ""; position: absolute; left: -3px; right: -3px; bottom: -8px; height: 8px;
    background: repeating-linear-gradient(90deg, #d32f2f 0 16px, #ececec 16px 32px);
    clip-path: polygon(0 0, 100% 0, 100% 40%, 87.5% 100%, 75% 40%, 62.5% 100%, 50% 40%, 37.5% 100%, 25% 40%, 12.5% 100%, 0 40%);
  }
  .stand .aside {
    position: absolute; top: 2px; right: 0; width: 10px; height: 26px;
    background: linear-gradient(90deg, #b71c1c, #8e1515);
    border: 3px solid var(--wood-dark); border-left: none;
    transform: skewY(-18deg); transform-origin: left top;
    border-radius: 0 8px 4px 0;
  }
  .stand .counter {
    position: absolute; bottom: 0; left: 10px; right: 16px; height: 34px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.25), transparent 30%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.09) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, #b8834c, var(--plank) 35%, var(--plank-dark));
    border: 3px solid var(--wood-dark); border-radius: 4px;
  }
  .stand .cside {
    position: absolute; bottom: 0; right: 8px; width: 10px; height: 34px;
    background: linear-gradient(90deg, #7a5228, #64401e);
    border: 3px solid var(--wood-dark); border-left: none;
    transform: skewY(-18deg); transform-origin: left bottom;
    border-radius: 0 4px 4px 0;
  }
  .stand .legL, .stand .legR { position: absolute; bottom: 30px; width: 7px; height: 26px; background: linear-gradient(90deg, #8a5e30, #6b4423); border: 2px solid var(--wood-dark); }

  .stand .basket { position: absolute; bottom: 26px; left: 47%; transform: translateX(-50%); font-size: 22px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }

  /* customers: cartoon bodies with emoji heads */
  .cust { position: absolute; cursor: pointer; }
  .cin { position: relative; display: flex; flex-direction: column; align-items: center; }
  .cbody { position: relative; width: 34px; height: 52px; }
  .cbody .chead {
    position: absolute; left: 50%; top: -2px; transform: translateX(-50%);
    font-size: 26px; line-height: 1; z-index: 2;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }
  .cbody svg { position: absolute; left: 0; bottom: 0; width: 34px; height: 34px; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.28)); }
  .cust.moving .cbody { animation: hop 0.3s ease-in-out infinite alternate; }
  .cust .cshadow {
    position: absolute; left: 50%; bottom: -3px;
    width: 30px; height: 9px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.28), rgba(0,0,0,0) 70%);
    border-radius: 50%;
  }
  .bubble {
    --bcol: #cfa76f;       /* border tinted by the rarity of what they want */
    position: absolute; bottom: calc(100% + 8px); right: -6px;
    background: linear-gradient(180deg, #ffffff, #fdf6e8);
    color: var(--ink);
    border: 2px solid var(--bcol); border-radius: 12px;
    padding: 5px 9px 7px;
    font-size: 14px; line-height: 1.25; white-space: nowrap;
    box-shadow: 0 4px 8px rgba(60,35,10,0.3), inset 0 1px 0 rgba(255,255,255,0.9);
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .bubble b { font-size: 15px; }
  .bubble::after {
    content: ""; position: absolute; bottom: -8px; right: 18px;
    width: 12px; height: 12px; background: #fdf6e8;
    border-right: 2px solid var(--bcol); border-bottom: 2px solid var(--bcol);
    transform: rotate(45deg) skew(12deg, 12deg);
  }
  .cust.can-sell .bubble {
    border-color: #43a047;
    box-shadow: 0 4px 8px rgba(60,35,10,0.3), 0 0 0 3px rgba(102,187,106,0.55);

  @keyframes sellPulse { from { transform: translateY(0); } to { transform: translateY(-3px); } }

  .pbar {
    display: block; height: 4px; margin-top: 4px;

  }
  .pbar span { display: block; height: 100%; background: #66bb6a; border-radius: 2px; }

  /* ------- touch controls ------- */
  .stick {
    position: absolute; z-index: 1000; display: none;
    width: 96px; height: 96px; margin: -48px 0 0 -48px;
    border-radius: 50%;

    position: absolute; left: 50%; top: 50%;

  .action-btn {
    position: absolute; right: 12px; bottom: 12px; z-index: 1001;
    width: 64px; height: 64px; border-radius: 50%;
    font-size: 28px; font-family: inherit;
    background: radial-gradient(circle at 38% 28%, #fff2b0, #ffd54f 55%, #f0ac12);
    border: 4px solid #b8860b;

    transition: transform 0.1s, filter 0.2s;
  }
  .action-btn:active { transform: scale(0.92); }
  .action-btn.idle { filter: grayscale(0.9) opacity(0.55); }

  /* ---------- Bottom bar: seeds + land + hint, one row ---------- */
  .bottombar {
    flex-shrink: 0;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .seed-btn, .land-btn {
    font-family: inherit; font-size: 0.72rem; color: var(--ink);

  .seed-btn:hover, .land-btn:hover { transform: translateY(-2px); }
  .seed-btn.selected {
    border-color: var(--gold);
    background: linear-gradient(180deg, #fff9d4, #ffe082 55%, #f7c93d);

  }
  .seed-btn.locked { filter: grayscale(1); opacity: 0.55; cursor: not-allowed; }
  .seed-btn.off-season { filter: grayscale(0.75); opacity: 0.7; }
  .seed-btn .big, .land-btn .big { font-size: 1.25rem; display: block; }
  .seed-btn small { display: block; font-size: 0.6rem; color: #6d5b45; }
  .land-btn {
    color: var(--cream);

  .land-btn.sold-out { display: none; }
  .hintmini {

  /* ---------- Toasts & floaters ---------- */
  #toasts {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);

  @keyframes toastin { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .floater {
    position: fixed; font-weight: bold; font-size: 1.1rem;
    pointer-events: none; z-index: 1200;
    animation: floatup 1s ease-out forwards;

  }
  @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-46px); } }
</style>

<script>
"use strict";

// ---------------- Rarity tiers ----------------
const RARITIES = {
  common:    { label: "Common",    color: "#a8a8a8" },
  uncommon:  { label: "Uncommon",  color: "#58c95e" },
  rare:      { label: "Rare",      color: "#42a5f5" },
  epic:      { label: "Epic",      color: "#c05ce0" },
  legendary: { label: "Legendary", color: "#ffb300" },
};

// ---------------- Crop definitions ----------------
// unlockPlots: how many plots you must own before this seed appears in the shop
// chops: how many axe swings to harvest — big crops take more
// ---------------- The march of history ----------------
// you start at the dawn of human time with flint and clay, and pay to advance
// through the ages — each age unlocks new crops and better tools
const ERAS = [
  { icon: "🗿", name: "Stone Age",      cost: 0,     chopBonus: 0, canUses: 2, canPrice: 40, canName: "clay pot",
    crops: ["wheat", "carrot"],        blurb: "Flint blades, clay pots, and wild seeds." },
  { icon: "🏺", name: "Bronze Age",     cost: 150,   chopBonus: 0, canUses: 3, canPrice: 40, canName: "bronze pot",
    crops: ["potato", "tomato"],       blurb: "Bronze sickles and proper farming begins." },
  { icon: "⚔️", name: "Iron Age",       cost: 500,   chopBonus: 1, canUses: 4, canPrice: 35, canName: "iron pail",
    crops: ["corn", "chili"],          blurb: "Iron tools bite deeper — big crops fall a chop sooner." },
  { icon: "🏰", name: "Medieval Age",   cost: 1500,  chopBonus: 1, canUses: 5, canPrice: 30, canName: "watering can",
    crops: ["pumpkin", "strawberry"],  blurb: "Wheelbarrows, crop rotation, and market fairs." },
  { icon: "⚙️", name: "Industrial Age", cost: 4000,  chopBonus: 2, canUses: 6, canPrice: 25, canName: "steel can",
    crops: ["watermelon", "grapes"],   blurb: "Steel and steam — even pumpkins fall in one swing." },
  { icon: "🚜", name: "Modern Age",     cost: 10000, chopBonus: 2, canUses: 8, canPrice: 20, canName: "garden hose",
    crops: ["sunflower", "starfruit"], blurb: "Tractors, hoses, and the mysterious starfruit." },
];
function era() { return ERAS[state.era || 0]; }
function chopsNeeded(c) { return Math.max(1, c.chops - era().chopBonus); }

// grow times scale with rarity: commons are quick, legendaries are a real wait.
// seasons follow real life: tomatoes love spring/summer, pumpkins are an autumn
// harvest, wheat grows year-round (winter wheat is real!), starfruit is magic.
// era: which age of history discovers this crop (index into ERAS).
const CROPS = {
  wheat:      { name: "Wheat",      emoji: "🌾", rarity: "common",    cost: 2,   growMs: 15000,  sell: 5,   era: 0, chops: 1, seasons: ["spring","summer","autumn","winter"] },
  carrot:     { name: "Carrot",     emoji: "🥕", rarity: "common",    cost: 5,   growMs: 30000,  sell: 12,  era: 0, chops: 1, seasons: ["spring","summer","autumn"] },
  potato:     { name: "Potato",     emoji: "🥔", rarity: "common",    cost: 8,   growMs: 45000,  sell: 18,  era: 1, chops: 1, seasons: ["spring","summer","autumn"] },
  tomato:     { name: "Tomato",     emoji: "🍅", rarity: "uncommon",  cost: 12,  growMs: 60000,  sell: 26,  era: 1, chops: 2, seasons: ["spring","summer"] },

// ---------------- Save / load ----------------
const SAVE_KEY = "tiny-farm-save";
function save() {
  state.lastSeen = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s.money === "number" && Array.isArray(s.plots)) {
        const now = Date.now();
        // older saves had a one-time can purchase — convert it to charges
        if (typeof s.water !== "number") s.water = s.can ? CAN_USES : 0;
        // older saves don't track crop rotation yet
        if (!Array.isArray(s.lastCrop)) s.lastCrop = Array.from({ length: GRID }, () => null);
        // older saves have no chickens or beehive yet
        if (!Array.isArray(s.chickens)) s.chickens = [];
        if (s.hive === undefined) s.hive = null;
        // a neighbor watched the hens while you were away — they come back
        // hungry (never starved), so returning players get time to feed them
        for (const c of s.chickens) {
          c.fedUntil = Math.max(c.fedUntil || 0, now - STARVE_MS * 0.4);
        }
        // older saves predate the ages — grant an era matching their old progress
        if (typeof s.era !== "number") {
          const p = s.plotsOwned || 4;
          s.era = p >= 23 ? 5 : p >= 19 ? 4 : p >= 15 ? 3 : p >= 11 ? 2 : p >= 7 ? 1 : 0;
        }
        // older saves tracked plantedAt timestamps — convert to banked growth
        for (const p of s.plots) {
          if (!p) continue;
          if (typeof p.grown !== "number") {
            let bonus = p.boost || 0;
            if (p.wateredAt) bonus += Math.min(now - p.wateredAt, WATER_MS);
            p.grown = now - (p.plantedAt || now) + bonus;
            delete p.plantedAt; delete p.boost; delete p.wateredAt;
          }
          p.ail = null;   // troubles don't persist across visits — be kind
        }
        // older saves predate seasons and forecasts — give them both
        if (!s.season || !SEASONS[s.season.name]) s.season = { name: "spring", until: now + SEASON_MS };
        if (s.weather && (!s.weather.next || !WEATHERS[s.weather.next])) {
          s.weather.next = pickWeatherKind(s.season.name);
        }
        // credit growth for time away (at calm sunny pace)
        if (typeof s.lastSeen === "number") {
          const away = Math.max(0, now - s.lastSeen);
          for (const p of s.plots) {
            if (p && p.grown < CROPS[p.crop].growMs) {
              p.grown = Math.min(CROPS[p.crop].growMs, p.grown + away);
            }
          }
        }
        return s;
      }
    }
  } catch (e) { /* corrupted save — start fresh */ }
  return null;
}

let audioCtx = null;
function blip(freq, dur = 0.08, type = "square", vol = 0.04) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* no audio available */ }
}

// deterministic per-spot jitter so the field looks hand-planted, not gridded
function jitter(i, mag) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return ((x - Math.floor(x)) * 2 - 1) * mag;
}

// ---------------- The field ----------------
let spotEls = [];

function spotPosition(i) {
  const row = Math.floor(i / COLS);
  const col = i % COLS;
  const left = 50 + (col - 2) * 19 * ROW_SPREAD[row] + jitter(i, 2.2) * ROW_SCALE[row];
  const top = ROW_TOP[row] + jitter(i * 7 + 3, 1.6);
  return { left, top, row };
}

// spot position in scene coordinates (%)
function spotScenePos(i) {
  const { left, top } = spotPosition(i);
  return { x: FIELD_LEFT + left * FIELD_WIDTH / 100, y: FIELD_TOP + top * FIELD_HEIGHT / 100 };
}

function rowsOwned() {
  return Math.ceil(state.plotsOwned / COLS);
}

function buildPlantHTML(crop, scale) {
  const p = PLANTS[crop];
  const w = p.w * scale, h = p.h * scale;
  let inner = "";
  for (const [x, sw, tilt, hf] of p.stems || []) {
    inner += `<i class="stem${p.stake ? " stake" : ""}" style="left:${x * scale}px; width:${Math.max(2, sw * scale)}px; height:${Math.round(hf * 100)}%; transform: rotate(${tilt}deg);"></i>`;
  }
  for (const [frac, flip] of p.cornleaves || []) {
    const side = flip > 0 ? "left:" + (17 * scale) + "px" : "left:" + (1 * scale) + "px";
    inner += `<i class="cornleaf${flip > 0 ? " flip" : ""}" style="${side}; bottom:${Math.round(frac * 100)}%; width:${16 * scale}px; height:${28 * scale}px;"></i>`;
  }
  for (const [x, b, d] of p.balls || []) {
    const dd = d * scale;
    inner += `<i class="leafball" style="left:${x}%; bottom:${b}%; width:${dd}px; height:${dd}px; margin-left:${-dd / 2}px;"></i>`;
  }
  const f = p.fruit;
  inner += `<span class="fruit" style="left:${f.x}%; bottom:${f.bottom * scale}px; font-size:${Math.round(f.size * scale)}px;">${f.e}</span>`;
  return `<div class="plant plant-${crop}" style="width:${w}px; height:${h}px;"><div class="sway">${inner}</div></div>`;
}

function buildField() {
  const field = $("fieldSpots");
  spotEls = [];
  for (let i = 0; i < GRID; i++) {
    const { left, top, row } = spotPosition(i);
    const s = ROW_SCALE[row];
    const sceneY = FIELD_TOP + top * FIELD_HEIGHT / 100;
    const el = document.createElement("div");
    el.className = "spot";
    el.style.left = left + "%";
    el.style.top = top + "%";
    el.style.zIndex = Math.round(sceneY * 10);   // nearer things draw on top
    el.innerHTML = `
      <div class="mound" style="left:${-21 * s}px; top:${-12 * s}px; width:${42 * s}px; height:${24 * s}px;"></div>
      <div class="sprite">
        <span class="bar" style="width:${38 * s}px;"><span></span></span>
        <span class="ailtag" style="font-size:${Math.round(16 * s)}px;"></span>
        <span class="plantbox"></span>
        <span class="weed-glyph"></span>
      </div>`;
    el.addEventListener("click", (ev) => { ev.stopPropagation(); walkToSpot(i); });
    field.appendChild(el);
    spotEls.push({
      el,
      scale: s,
      plantbox: el.querySelector(".plantbox"),
      weed: el.querySelector(".weed-glyph"),
      ailtag: el.querySelector(".ailtag"),
      barFill: el.querySelector(".bar span"),
      sig: "",
      plantEl: null,
    });
  }
}

function updateField() {
  const now = Date.now();
  const rows = rowsOwned();

  // the tilled soil covers only the rows you own — it visibly grows with your farm
  $("soil").style.top = (ROW_TOP[rows - 1] - 13) + "%";

  for (let i = 0; i < GRID; i++) {
    const s = spotEls[i];
    let sig, cls = "spot", barPct = -1;
    let prog = 0, crop = null;

    if (i >= state.plotsOwned) {
      const inSoil = Math.floor(i / COLS) < rows;
      sig = inSoil ? "weed" : "hidden";
      cls += inSoil ? " locked" : " hidden";
    } else {
      const p = state.plots[i];
      if (!p) {
        sig = "empty";
        cls += " stage-empty";
      } else if (p.dead) {
        sig = "dead:" + p.crop;
        cls += " dead";
      } else {
        crop = p.crop;
        const c = CROPS[crop];
        prog = Math.min(1, p.grown / c.growMs);
        if (prog >= 1) { sig = "ready:" + crop; cls += " ready r-" + c.rarity; }
        else {
          const wet = isWet(p);
          const ail = p.ail || "";
          const dormant = !inSeason(crop);
          sig = "grow:" + crop + ":" + (wet ? "w" : "") + ail + (dormant ? "z" : "") + (p.tired ? "t" : "");
          cls += " growing" + (wet ? " wet" : "") + (ail ? " ail-" + ail : "") + (dormant ? " dormant" : "") + (p.tired ? " tired" : "");
          barPct = Math.round(prog * 100);
        }
      }
    }

    if (s.sig !== sig) {
      const kind = sig.split(":")[0];
      const prevKind = s.sig.split(":")[0];
      s.sig = sig;
      s.el.className = cls + (s.el.classList.contains("near") ? " near" : "");
      const gp = kind === "grow" ? state.plots[i] : null;
      s.ailtag.textContent = gp
        ? (gp.ail ? AILS[gp.ail].tag : (!inSeason(gp.crop) ? "💤" : (gp.tired ? "🐌" : "")))
        : (kind === "dead" ? "💀" : "");
      s.weed.textContent = kind === "weed" ? (i % 2 ? "🌿" : "🪨") : (kind === "dead" ? "🥀" : "");
      if (kind === "weed") s.weed.style.fontSize = Math.round(20 * s.scale) + "px";
      if (kind === "dead") s.weed.style.fontSize = Math.round(26 * s.scale) + "px";
      if (kind === "grow" || kind === "ready") {
        if (!(prevKind === "grow" || prevKind === "ready") || !s.plantEl || !s.plantEl.classList.contains("plant-" + crop)) {
          s.plantbox.innerHTML = buildPlantHTML(crop, s.scale);
          s.plantEl = s.plantbox.querySelector(".plant");
        }
      } else if (s.plantEl) {
        s.plantbox.innerHTML = "";
        s.plantEl = null;
      }
    }

    // continuous growth: the whole plant scales up from a seedling
    if (s.plantEl) {
      const k = 0.15 + 0.85 * prog;
      s.plantEl.style.transform = `scale(${k.toFixed(3)})`;
      s.plantEl.classList.toggle("fruited", prog >= 0.8);
      if (PLANTS[crop].goldWhenRipe) s.plantEl.classList.toggle("ripe-gold", prog >= 0.95);
    }
    if (barPct >= 0) s.barFill.style.width = barPct + "%";

    // a struggling plant flashes its warning harder as death approaches
    const pp = state.plots[i];
    s.el.classList.toggle("dying",
      !!(i < state.plotsOwned && pp && !pp.dead && pp.ail && now - (pp.ailAt || now) > AIL_DEATH_MS * 0.5));
  }

  const landBtn = $("landBtn");
  if (landBtn) {
    if (state.plotsOwned >= GRID) {
      landBtn.classList.add("sold-out");
    } else {
      landBtn.classList.remove("sold-out");
      landBtn.querySelector("b").textContent = "$" + landPrice();
    }
  }
}

// ---------------- The farmer ----------------
const farmer = {
  x: 50, y: 82,            // scene %
  facing: 1,
  target: null,            // { x, y, spot } walk-to destination
  chopUntil: 0,
  keys: new Set(),
  joy: null,               // { id, ox, oy, dx, dy } active touch joystick
};
const Y_MIN = 39, Y_MAX = 97;
const SPEED_X = 40, SPEED_Y = 30;    // walk speed, scene % per second

function farmerScale(y) {
  return 0.55 + (y - Y_MIN) / (Y_MAX - Y_MIN) * 0.5;
}

// what the farmer could act on right now: nearest mound/crop/weed/customer in reach
function nearestTarget() {
  let best = null, bestD = 13;       // interaction radius in scene % — generous on purpose
  const consider = (x, y, kind, idx) => {
    const d = Math.hypot(farmer.x - x, (farmer.y - y) * 1.5);
    if (d < bestD) { bestD = d; best = { kind, idx, x, y }; }
  };
  const rows = rowsOwned();
  for (let i = 0; i < GRID; i++) {
    const { x, y } = spotScenePos(i);
    if (i >= state.plotsOwned) {
      if (Math.floor(i / COLS) < rows) consider(x, y, "buy", i);
      continue;
    }
    const p = state.plots[i];
    if (!p) consider(x, y, "plant", i);
    else if (p.dead) consider(x, y, "clear", i);
    else if (isReady(p)) consider(x, y, "chop", i);
    else if (p.ail === "soggy") consider(x, y, "drain", i);
    else if (p.ail === "frozen") consider(x, y, "thaw", i);
    else if (p.ail === "wilt") consider(x, y, "water", i);
    else if (state.water > 0 && !isWet(p) && inSeason(p.crop) &&
             WEATHERS[(state.weather && state.weather.kind) || "sunny"].mult <= 1) {
      consider(x, y, "water", i);   // no point watering in the rain or a sleeping plant
    }
  }
  for (const c of customers) {
    consider(c.px, c.py, "sell", "c" + c.id);
  }
  return best;
}

let lastNear = null;
function updateNearHighlight(t) {
  const key = t ? t.kind + ":" + t.idx : "";
  if (key === lastNear) return;
  lastNear = key;
  for (const s of spotEls) s.el.classList.remove("near");
  for (const [, ce] of custEls) ce.el.classList.remove("near");
  const btn = $("actionBtn");
  if (!t) {
    btn.textContent = "🚶";
    btn.classList.add("idle");
    return;
  }
  btn.classList.remove("idle");
  btn.textContent =
    t.kind === "plant" ? CROPS[selectedSeed].emoji :
    t.kind === "chop"  ? (state.era === 0 ? "🪨" : "🪓") :
    t.kind === "water" ? "💧" :
    t.kind === "drain" ? "🪣" :
    t.kind === "thaw"  ? "⛏️" :
    t.kind === "clear" ? "🧹" :
    t.kind === "sell"  ? "💰" : "🪧";
  if (t.kind === "sell") {
    const ce = custEls.get(Number(String(t.idx).slice(1)));
    if (ce) ce.el.classList.add("near");
  } else {
    spotEls[t.idx].el.classList.add("near");
  }
}

function doAction() {
  if (Date.now() < farmer.chopUntil) return;
  const t = nearestTarget();
  if (!t) return;
  if (t.kind === "plant") plantAt(t.idx);
  else if (t.kind === "chop") chopAt(t.idx);
  else if (t.kind === "water") waterAt(t.idx);
  else if (t.kind === "drain" || t.kind === "thaw") cureAt(t.idx);
  else if (t.kind === "clear") clearAt(t.idx);
  else if (t.kind === "sell") serve(Number(String(t.idx).slice(1)));
  else buyLand();
}

function walkToSpot(i) {
  const { x, y } = spotScenePos(i);
  farmer.target = { x, y: Math.min(Y_MAX, y + 3), spot: i };
}

const farmerEl = $("farmer");
function updateFarmer(dt) {
  const now = Date.now();
  let dx = 0, dy = 0;

  if (farmer.joy && (farmer.joy.dx || farmer.joy.dy)) {
    dx = farmer.joy.dx; dy = farmer.joy.dy;
    farmer.target = null;
  } else {
    const k = farmer.keys;
    if (k.has("left")) dx -= 1;
    if (k.has("right")) dx += 1;
    if (k.has("up")) dy -= 1;
    if (k.has("down")) dy += 1;
    if (dx || dy) farmer.target = null;
    else if (farmer.target) {
      const tx = farmer.target.x - farmer.x, ty = farmer.target.y - farmer.y;
      const dist = Math.hypot(tx, ty * 1.5);
      if (dist < 2.2) {
        const arrived = farmer.target;
        farmer.target = null;
        if (arrived.spot !== undefined) doAction();
      } else {
        dx = tx; dy = ty;
      }
    }
  }

  const mag = Math.hypot(dx, dy);
  const moving = mag > 0.01 && now >= farmer.chopUntil;
  if (moving) {
    dx /= mag; dy /= mag;
    // joystick gives analog speed: gentle drags walk, bigger drags run
    const throttle = farmer.joy ? Math.min(1, mag) : 1;
    farmer.x += dx * SPEED_X * throttle * dt;
    farmer.y += dy * SPEED_Y * throttle * dt;
    farmer.x = Math.max(2, Math.min(98, farmer.x));
    farmer.y = Math.max(Y_MIN, Math.min(Y_MAX, farmer.y));
    if (dx > 0.1) farmer.facing = 1;
    if (dx < -0.1) farmer.facing = -1;
  }

  const s = farmerScale(farmer.y);
  farmerEl.style.left = farmer.x + "%";
  farmerEl.style.top = farmer.y + "%";
  farmerEl.style.zIndex = Math.round(farmer.y * 10) + 1;
  farmerEl.style.transform = `translate(-50%, -94%) scale(${(s * farmer.facing).toFixed(3)}, ${s.toFixed(3)})`;
  farmerEl.classList.toggle("walking", moving);
  farmerEl.classList.toggle("chopping", now < farmer.chopUntil);

  updateNearHighlight(nearestTarget());
}

// ---------------- Customers: cartoon people at the stand ----------------
const custEls = new Map();   // id -> { el, barFill }

function buildCustomerEl(cust) {
  const c = itemDef(cust.crop);
  const shirt = SHIRTS[cust.id % SHIRTS.length];
  const pants = ["#55524e","#3f5f8f","#6d4620"][cust.id % 3];
  const el = document.createElement("div");
  el.className = "cust moving";
  el.innerHTML = `
    <div class="cin">
      <div class="bubble" style="--bcol:${RARITIES[c.rarity].color}">${cust.qty}× ${c.emoji} <b>$${cust.pay != null ? cust.pay : c.sell * cust.qty}</b><span class="pbar"><span></span></span></div>
      <div class="cshadow"></div>
      <div class="cbody">
        <span class="chead">${cust.face}</span>
        <svg viewBox="0 0 34 34">
          <rect x="5" y="22" width="8" height="10" rx="3" fill="${pants}"/>
          <rect x="21" y="22" width="8" height="10" rx="3" fill="${pants}"/>
          <rect x="1.5" y="4" width="7" height="15" rx="3.5" fill="${shirt}" opacity="0.85"/>
          <rect x="25.5" y="4" width="7" height="15" rx="3.5" fill="${shirt}" opacity="0.85"/>
          <path d="M6 4 Q17 -1 28 4 L28 20 Q28 25 23 25 L11 25 Q6 25 6 20 Z" fill="${shirt}"/>
          <path d="M22 4 L28 4 L28 20 Q28 25 23 25 L20 25 Q24 15 22 4 Z" fill="rgba(0,0,0,0.16)"/>
        </svg>
      </div>
    </div>`;
  el.addEventListener("click", (ev) => { ev.stopPropagation(); serve(cust.id); });
  $("scene").appendChild(el);
  custEls.set(cust.id, { el, barFill: el.querySelector(".pbar span") });
  return el;
}

// called on the slow tick: create/remove customer elements, refresh bubbles
function renderCustomers() {
  const now = Date.now();
  for (const [id, ce] of custEls) {
    if (!customers.some(c => c.id === id) && !ce.el.classList.contains("leaving")) {
      ce.el.classList.add("leaving");
      setTimeout(() => { ce.el.remove(); custEls.delete(id); }, 500);
    }
  }
  for (const cust of customers) {
    let ce = custEls.get(cust.id);
    if (!ce) { buildCustomerEl(cust); ce = custEls.get(cust.id); }
    const left = Math.max(0, 1 - (now - cust.arrivedAt) / PATIENCE_MS);
    ce.barFill.style.width = (left * 100) + "%";
    ce.barFill.style.background = left < 0.3 ? "#ef5350" : left < 0.6 ? "#ffa726" : "#66bb6a";
    ce.el.classList.toggle("can-sell", (state.barn[cust.crop] || 0) >= cust.qty);
  }
}

// called every frame: walk customers to their place in the queue
function moveCustomers(dt) {
  customers.forEach((cust, qi) => {
    const ce = custEls.get(cust.id);
    if (!ce) return;
    const slot = QUEUE_SLOTS[Math.min(qi, QUEUE_SLOTS.length - 1)];
    const dx = slot.x - cust.px, dy = slot.y - cust.py;
    const dist = Math.hypot(dx, dy);
    const moving = dist > 0.6;
    if (moving) {
      const step = Math.min(dist, 24 * dt);
      cust.px += dx / dist * step;
      cust.py += dy / dist * step;
    }
    const s = farmerScale(Math.min(cust.py, Y_MAX)) * 0.92;
    ce.el.style.left = cust.px + "%";
    ce.el.style.top = cust.py + "%";
    ce.el.style.zIndex = Math.round(cust.py * 10);
    ce.el.style.transform = `translate(-50%, -96%) scale(${s.toFixed(3)})`;
    ce.el.classList.toggle("moving", moving);
  });
}

// ---------------- Rendering (header / shop) ----------------
function renderHeader() {
  $("money").textContent = "$" + state.money;
  $("eraTag").textContent = `${era().icon} ${era().name}`;
  const inv = $("barnInv");
  inv.innerHTML = "";
  const entries = Object.entries(state.barn).filter(([, n]) => n > 0);
  if (entries.length === 0) {
    inv.innerHTML = '<span class="item">🧺 empty</span>';
  } else {
    for (const [crop, n] of entries) {
      const d = document.createElement("span");
      d.className = "item";
      d.textContent = `${itemDef(crop).emoji}×${n}`;
      inv.appendChild(d);
    }

}

function renderSeeds() {
  const wrap = $("seeds");
  wrap.innerHTML = "";

  // advance-the-age chip comes first: pay to move history forward
  const cur = era(), nxt = ERAS[state.era + 1];
  const eraBtn = document.createElement("button");
  eraBtn.id = "eraBtn";
  eraBtn.className = "land-btn era-btn";
  if (nxt) {
    eraBtn.title = `Advance to the ${nxt.name} — unlocks ${nxt.crops.map(k => CROPS[k].name).join(" & ")} and better tools. ${nxt.blurb}`;
    eraBtn.innerHTML = `<span class="big">${nxt.icon}</span><b>$${nxt.cost}</b><small>next age</small>`;
    eraBtn.onclick = () => advanceEra();
  } else {
    eraBtn.title = "You have reached the Modern Age — the final era of history";
    eraBtn.innerHTML = `<span class="big">${cur.icon}</span><b>${cur.name.split(" ")[0]}</b><small>final age</small>`;
  }
  wrap.appendChild(eraBtn);

  for (const [key, c] of Object.entries(CROPS)) {
    const locked = c.era > state.era;
    const rar = RARITIES[c.rarity];
    const btn = document.createElement("button");
    btn.className = "seed-btn" + (key === selectedSeed ? " selected" : "") + (locked ? " locked" : "");
    const dm = DEMAND[demandOf(key)];
    const off = !locked && !inSeason(key);
    btn.title = locked
      ? `${c.name} (${rar.label}) — discovered in the ${ERAS[c.era].name}. Grows in ${seasonIcons(key)}`
      : `${c.name} (${rar.label}) — plant $${c.cost}, sells $${c.sell}. Grows in ${seasonIcons(key)}`;
    if (off) btn.classList.add("off-season");
    btn.innerHTML = locked
      ? `<span class="big">🔒</span>${ERAS[c.era].icon} age`
      : off
        ? `<span class="big">${c.emoji}</span>$${c.cost}<small style="color:#1565c0">💤 ${seasonIcons(key)}</small>`
        : `<span class="big">${c.emoji}</span>$${c.cost}<small style="color:${dm.color}">${dm.label}</small>`;
    // rarity shows as the chip's border and a stripe under the price
    btn.style.borderColor = rar.color;
    if (!locked) btn.style.boxShadow = `0 2px 0 rgba(90,60,25,0.5), 0 4px 6px rgba(60,35,10,0.2), inset 0 -3px 0 ${rar.color}`;
    btn.onclick = () => {
      if (locked) { sndNope(); toast(`${c.emoji} ${c.name} is discovered in the ${ERAS[c.era].icon} ${ERAS[c.era].name}!`); return; }
      selectedSeed = key;
      lastNear = "?";        // refresh the action button icon
      renderSeeds();
    };
    wrap.appendChild(btn);
  }
  // this era's water carrier — from clay pot to garden hose
  const canBtn = document.createElement("button");
  canBtn.className = "seed-btn";
  canBtn.style.borderColor = "#42a5f5";
  canBtn.title = `${cur.canName} — $${cur.canPrice} for ${cur.canUses} waterings. Each soak makes a crop grow ${WATER_MULT}× faster for ${WATER_MS / 1000}s.`;
  canBtn.innerHTML = `<span class="big">💧</span>$${cur.canPrice}${state.water > 0 ? `<small>×${state.water} left</small>` : `<small>×${cur.canUses} uses</small>`}`;
  canBtn.onclick = () => buyWater();
  wrap.appendChild(canBtn);
  // buy-land button lives on the shelf too, so it never covers the farm
  const landBtn = document.createElement("button");
  landBtn.id = "landBtn";
  landBtn.className = "land-btn" + (state.plotsOwned >= GRID ? " sold-out" : "");
  landBtn.title = "Buy the next plot of land (or walk to the weeds)";
  landBtn.innerHTML = `<span class="big">🪧</span><b>$${landPrice()}</b>`;
  landBtn.onclick = () => buyLand();
  wrap.appendChild(landBtn);
}

function renderAll() {
  renderHeader();
  renderSeeds();
  updateField();
  renderCustomers();
}

// ---------------- Actions ----------------
function plantAt(i) {
  const c = CROPS[selectedSeed];
  if (c.era > state.era) return;
  if (!inSeason(selectedSeed)) {
    sndNope();
    toast(`${c.emoji} ${c.name} won't grow in ${SEASON_ICON[currentSeason()]} ${SEASONS[currentSeason()].name} — it grows in ${seasonIcons(selectedSeed)}`);
    return;
  }
  if (state.money < c.cost) {
    sndNope();
    toast(`Need $${c.cost} to plant ${c.name}!`);
    return;
  }
  state.money -= c.cost;
  // planting the same crop where it just grew tires the soil — rotate!
  const tired = state.lastCrop[i] === selectedSeed;
  state.plots[i] = { crop: selectedSeed, grown: 0, tired: tired || undefined };
  state.lastCrop[i] = selectedSeed;
  sndPlant();
  const { x, y } = spotScenePos(i);
  sceneFloater(`-$${c.cost}`, x, y, "#c62828");
  if (tired) {
    sceneFloater("🐌 tired soil", x, y - 6, "#8d6e63");
    toast(`😴 This soil just grew ${c.emoji} ${c.name} — it's tired! Growth is 50% slower. Rotate your crops!`);
  }
  lastNear = "?";
  save();
  renderHeader();
  updateField();
}

function waterAt(i) {
  const p = state.plots[i];
  if (!p || p.dead || isWet(p)) return;
  if (state.water <= 0) {
    sndNope();
    toast("💧 The watering can is empty — grab a refill from the shelf!");
    return;
  }
  const wasWilting = p.ail === "wilt";
  p.wetUntil = Date.now() + WATER_MS;
  if (wasWilting) { p.ail = null; p.safe = Date.now() + 12000; }
  state.water--;
  const { x, y } = spotScenePos(i);
  farmer.facing = x >= farmer.x ? 1 : -1;
  blip(880, 0.05, "sine", 0.05);
  setTimeout(() => blip(660, 0.07, "sine", 0.05), 60);
  sceneFloater(wasWilting ? "💧 revived!" : "💧", x, y, "#2196f3");
  if (state.water === 0) toast("💧 The watering can is empty — grab a refill from the shelf!");
  lastNear = "?";
  save();
  renderSeeds();
  updateField();
}

// sweep away a dead plant so the plot can be replanted
function clearAt(i) {
  const p = state.plots[i];
  if (!p || !p.dead) return;
  state.plots[i] = null;
  const { x, y } = spotScenePos(i);
  farmer.facing = x >= farmer.x ? 1 : -1;
  farmer.chopUntil = Date.now() + 300;
  farmerEl.classList.remove("chopping");
  void farmerEl.offsetWidth;
  blip(240, 0.1, "triangle", 0.04);
  sceneFloater("🧹 cleared", x, y, "#8d6e63");
  lastNear = "?";
  save();
  updateField();
}

// free fixes: drain a puddle, break the ice
function cureAt(i) {
  const p = state.plots[i];
  if (!p || !p.ail || p.ail === "wilt") return;
  const a = AILS[p.ail];
  p.ail = null;
  p.safe = Date.now() + 12000;   // a freshly helped plant gets a breather
  const { x, y } = spotScenePos(i);
  farmer.facing = x >= farmer.x ? 1 : -1;
  farmer.chopUntil = Date.now() + 300;   // little dig/whack animation
  farmerEl.classList.remove("chopping");
  void farmerEl.offsetWidth;
  blip(300, 0.08, "triangle", 0.05);
  sceneFloater(`${a.tag} ${a.fixed}`, x, y, "#1976d2");
  lastNear = "?";
  save();
  updateField();
}

function chopAt(i) {
  const p = state.plots[i];
  if (!p) return;
  const c = CROPS[p.crop];
  if (!isReady(p)) return;

  // face the crop and swing the axe
  const { x, y } = spotScenePos(i);
  farmer.facing = x >= farmer.x ? 1 : -1;
  farmer.chopUntil = Date.now() + 340;
  farmerEl.classList.remove("chopping");
  void farmerEl.offsetWidth;
  sndChop();

  if (p.chopsLeft === undefined) p.chopsLeft = chopsNeeded(c);
  p.chopsLeft--;

  const s = spotEls[i];
  if (p.chopsLeft > 0) {
    // wobble but stay standing
    if (s.plantEl) {
      s.plantEl.classList.remove("shake");
      void s.plantEl.offsetWidth;
      s.plantEl.classList.add("shake");
    }
    save();
    return;
  }

  // timber! the crop falls and goes in the barn
  state.plots[i] = null;
  state.barn[p.crop] = (state.barn[p.crop] || 0) + 1;
  const ghost = document.createElement("div");
  ghost.className = "chopped";
  ghost.textContent = c.emoji;
  ghost.style.left = x + "%";
  ghost.style.top = y + "%";
  ghost.style.fontSize = Math.round(34 * s.scale) + "px";
  $("scene").appendChild(ghost);
  setTimeout(() => ghost.remove(), 700);
  sndHarvest();
  sceneFloater(`+1 ${c.emoji}`, x, y);
  lastNear = "?";
  save();
  renderHeader();
  updateField();
  renderCustomers();
}

function serve(id) {
  const idx = customers.findIndex(c => c.id === id);
  if (idx === -1) return;
  const cust = customers[idx];
  const c = itemDef(cust.crop);
  if ((state.barn[cust.crop] || 0) < cust.qty) {
    sndNope();
    toast(`${cust.face} wants ${cust.qty}× ${c.emoji} — you don't have enough yet!`);
    return;
  }
  const total = cust.pay != null ? cust.pay : c.sell * cust.qty;
  state.barn[cust.crop] -= cust.qty;
  state.money += total;
  customers.splice(idx, 1);
  sndSell();
  popMoney();
  sceneFloater(`+$${total}`, cust.px, cust.py - 8, "#f9a825");
  toast(`${cust.face} "Thank you!" +$${total}`);
  lastNear = "?";
  save();
  renderHeader();
  renderCustomers();
}

function buyWater() {
  const e = era();
  if (state.money < e.canPrice) {
    sndNope();
    toast(`Need $${e.canPrice} to fill the ${e.canName}!`);
    return;
  }
  state.money -= e.canPrice;
  state.water += e.canUses;
  sndBuy();
  toast(`💧 ${e.canName} filled — ${state.water} waterings! A soaked crop grows ${WATER_MULT}× faster.`);
  lastNear = "?";
  save();
  renderHeader();
  renderSeeds();
}
