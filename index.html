// ---------------- Customer arrivals ----------------
function scheduleNextCustomer() {
  nextCustomerAt = Date.now() + 9000 + Math.random() * 11000;
}

function spawnCustomer() {
  const options = unlockedCrops();
  // customers prefer cheaper crops (so early game stays winnable),
  // and flock to whatever the market says is in demand
  const weighted = [];
  options.forEach((k, idx) => {
    const base = Math.max(1, options.length - idx);
    const seasonal = inSeason(k) ? 1 : 0.25;   // folk rarely ask for out-of-season produce
    const w = Math.max(1, Math.round(base * DEMAND[demandOf(k)].freqMult * seasonal * 4));
    for (let j = 0; j < w; j++) weighted.push(k);
  });
  // village folk love fresh eggs and honey once you produce them
  if (state.chickens.length > 0) {
    for (let j = 0; j < options.length * 3; j++) weighted.push("egg");
  }
  if (state.hive) {
    for (let j = 0; j < options.length * 2; j++) weighted.push("honey");
  }
  const crop = weighted[Math.floor(Math.random() * weighted.length)];
  // eggs are only worth selling by the dozen
  const qty = crop === "egg" ? EGG_DOZEN : 1 + Math.floor(Math.random() * 3);
  customers.push({
    id: ++customerId,
    face: FACES[Math.floor(Math.random() * FACES.length)],
    crop,
    qty,
    // the price is locked in when they join the queue
    pay: Math.round(itemDef(crop).sell * qty * DEMAND[demandOf(crop)].priceMult),
    arrivedAt: Date.now(),
    px: 106, py: 99,         // walks in from the bottom-right corner
  });
}

// ---------------- Weather engine ----------------
function pickWeatherKind(seasonName) {
  // rarely, the sky just goes wild — extreme weather ignores the season
  if (Math.random() < EXTREME_CHANCE) {
    return EXTREMES[Math.floor(Math.random() * EXTREMES.length)];
  }
  const sn = seasonName || (state && state.season ? state.season.name : "spring");
  const weights = SEASONS[sn].weights;
  const total = Object.values(weights).reduce((a, w) => a + w, 0);
  let r = Math.random() * total;
  for (const [k, w] of Object.entries(weights)) {
    r -= w;
    if (r <= 0) return k;
  }
  return "sunny";
}

function rollWeather(now) {
  // the forecast keeps its promise: what the badge predicted is what arrives
  const kind = (state.weather && state.weather.next) || pickWeatherKind();
  const dur = EXTREMES.includes(kind) && kind !== "storm"
    ? 25000 + Math.random() * 20000                       // extremes hit hard but pass quickly
    : (kind === "sunny" ? 50 : 40) * 1000 + Math.random() * 50000;
  state.weather = { kind, until: now + dur, next: pickWeatherKind() };
  // a change in the sky clears old troubles — puddles dry, ice melts
  for (const p of state.plots) if (p && !p.dead) { p.ail = null; p.ailAt = 0; }
  applyWeatherUI();
  toast(WEATHERS[kind].msg);
  save();
}

function applyWeatherUI() {
  const kind = state.weather ? state.weather.kind : "sunny";
  const w = WEATHERS[kind];
  $("wx").className = "wx " + kind;
  const next = state.weather && state.weather.next ? WEATHERS[state.weather.next] : null;
  $("wxBadge").innerHTML = `${w.icon} ${w.name}` + (next
    ? ` <span class="wxnext">→ ${next.icon} in <span id="wxTime">?</span></span>`
    : "");
}

function updateForecastClock(now) {
  const t = $("wxTime");
  if (!t || !state.weather) return;
  const s = Math.max(0, Math.ceil((state.weather.until - now) / 1000));
  t.textContent = s + "s";
}

// ---------------- Market demand engine ----------------
function rollDemand(now) {
  const keys = Object.keys(CROPS);
  // shuffle, then crown one hot, one high, and mark two as low
  for (let i = keys.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [keys[i], keys[j]] = [keys[j], keys[i]];
  }
  const d = {};
  for (const k of keys) d[k] = "normal";
  d[keys[0]] = "hot";
  d[keys[1]] = "high";
  d[keys[2]] = "low";
  d[keys[3]] = "low";
  state.demand = d;
  state.demandUntil = now + DEMAND_MS + Math.random() * 40000;
  toast(`📊 Market news: ${CROPS[keys[0]].emoji} ${CROPS[keys[0]].name} is in 🔥 HOT demand! ` +
        `${CROPS[keys[2]].emoji}${CROPS[keys[3]].emoji} selling cheap.`);
  renderSeeds();
  renderMarket();
  save();
}

// the market board: every crop's demand and today's price, hot deals first
function renderMarket() {
  const panel = $("mktPanel");
  if (panel.hidden) return;
  const rank = { hot: 0, high: 1, normal: 2, low: 3 };
  const rows = Object.entries(CROPS)
    .map(([key, c]) => ({ key, c, dm: demandOf(key) }))
    .sort((a, b) => rank[a.dm] - rank[b.dm]);
  panel.innerHTML = "<h3>📊 Market demand</h3>" + rows.map(({ key, c, dm }) => {
    const d = DEMAND[dm];
    const locked = c.era > state.era;
    const off = !inSeason(key);
    const price = Math.round(c.sell * d.priceMult);
    return `<div class="mkt-row${locked ? " locked" : ""}${off ? " locked" : ""}" title="Grows in ${seasonIcons(key)}">
      <span class="nm">${locked ? "🔒" : ""}${off ? "💤" : ""}${c.emoji} ${c.name}</span>
      <b style="color:${d.color}">${d.label}</b>
      <span class="pr">$${price}</span>
    </div>`;
  }).join("") + `<div class="mkt-note">🔥 more buyers &amp; better prices · ▼ few buyers, low prices<br>💤 = out of season right now · Prices are per item at today's demand.</div>`;
}

function toggleMarket(open) {
  const panel = $("mktPanel");
  panel.hidden = open === undefined ? !panel.hidden : !open;
  $("mktBtn").classList.toggle("open", !panel.hidden);
  renderMarket();
}

// slow tick: create/remove hen elements, lay eggs, starve the forgotten
function renderChickens() {
  const now = Date.now();

  // a hen left hungry too long starves
  const starved = state.chickens.filter(c => now - (c.fedUntil || 0) > STARVE_MS);
  if (starved.length) {
    state.chickens = state.chickens.filter(c => !starved.includes(c));
    for (const c of starved) {
      toast(`💀 ${c.name} starved! Keep corn in the barn to feed your hens.`);
    }
    blip(110, 0.3, "sawtooth", 0.05);
    save();
    renderCoop();
  }

  for (const [id, el] of chickEls) {
    if (!state.chickens.some(c => c.id === id)) { el.remove(); chickEls.delete(id); }
  }
  let laid = false;
  for (const c of state.chickens) {
    if (!chickEls.has(c.id)) buildChickEl(c);
    const el = chickEls.get(c.id);
    const hungry = !isFed(c);
    el.querySelector(".ctag").textContent = hungry ? "🍽️" : "";
    el.classList.toggle("starving", hungry && now - c.fedUntil > STARVE_MS * 0.5);
    // fed hens lay eggs wherever they happen to be
    if (!hungry && now >= c.eggAt) {
      c.eggAt = now + EGG_MS[0] + Math.random() * (EGG_MS[1] - EGG_MS[0]);
      state.barn.egg = (state.barn.egg || 0) + 1;
      sceneFloater("🥚 +1", c.px, c.py, "#8d6e63");
      laid = true;
    }
  }
  if (laid) { blip(700, 0.05, "sine", 0.04); save(); renderHeader(); renderCustomers(); }
}

// every frame: hens wander the field when out, head home when called back
function moveChickens(dt) {
  for (const c of state.chickens) {
    const el = chickEls.get(c.id);
    if (!el) continue;
    let tx, ty;
    if (c.out) {
      const arrived = c.tx !== undefined && Math.abs(c.px - c.tx) < 1.2 && Math.abs(c.py - c.ty) < 1.2;
      if (arrived && !c.pauseUntil) {
        // stop for a peck around before wandering on
        c.pauseUntil = Date.now() + 1200 + Math.random() * 2600;
      }
      if (c.tx === undefined || (arrived && Date.now() > c.pauseUntil)) {
        c.pauseUntil = 0;
        // hens head for the plants themselves to scratch the soil around them
        const planted = [];
        for (let i = 0; i < state.plotsOwned; i++) {
          if (state.plots[i] && !state.plots[i].dead) planted.push(i);
        }
        if (planted.length && Math.random() < 0.75) {
          const { x, y } = spotScenePos(planted[Math.floor(Math.random() * planted.length)]);
          c.tx = x + (Math.random() - 0.5) * 5;
          c.ty = y + Math.random() * 2.5;
        } else {
          c.tx = 16 + Math.random() * 62;    // or wander the meadow
          c.ty = 46 + Math.random() * 47;
        }
      }
      tx = c.tx; ty = c.ty;
    } else {
      const idx = state.chickens.indexOf(c);
      const home = chickHome(idx);
      tx = home.x; ty = home.y;
    }
    const dx = tx - c.px, dy = ty - c.py;
    const d = Math.hypot(dx, dy);
    const moving = d > 1;
    if (moving) {
      const step = Math.min(d, 6.5 * dt);
      c.px += dx / d * step;
      c.py += dy / d * step;
      if (dx > 0.05) c.face = 1;
      else if (dx < -0.05) c.face = -1;
    }
    const s = farmerScale(Math.max(Y_MIN, Math.min(c.py, Y_MAX))) * 0.9;
    el.style.left = c.px + "%";
    el.style.top = c.py + "%";
    el.style.zIndex = Math.round(c.py * 10);
    el.style.transform = `translate(-50%, -92%) scale(${(s * (c.face || 1)).toFixed(3)}, ${s.toFixed(3)})`;
    el.classList.toggle("moving", moving);
  }
}

// cheap per-tick refresh of timers and buttons (no rebuild, taps stay safe)
function updateCoopStatus() {
  const now = Date.now();
  for (const c of state.chickens) {
    const r = coopRows.get(c.id);
    if (!r) continue;
    if (isFed(c)) {
      const s = Math.ceil((c.fedUntil - now) / 1000);
      r.status.textContent = `${c.out ? "🌱 roaming" : "🏠 in coop"} · fed ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    } else if (now - c.fedUntil > STARVE_MS * 0.5) {
      r.status.textContent = `${c.out ? "🌱 roaming" : "🏠 in coop"} · ⚠️ STARVING!`;
    } else {
      r.status.textContent = `${c.out ? "🌱 roaming" : "🏠 in coop"} · 🍽️ hungry`;
    }
    r.outBtn.textContent = c.out ? "🏠 Call back" : "🌱 Send out";
  }
  const cc = coopRows.get("corn");
  if (cc) cc.status.textContent = state.barn.corn || 0;
  const cb = coopRows.get("cornbuy");
  if (cb) {
    cb.status.textContent = inSeason("corn")
      ? `🌽 Buy corn — $${cornPrice()}`
      : `🌽 Emergency corn — $${cornPrice()} (out of season!)`;
  }
  const hr = coopRows.get("hive");
  if (hr && state.hive) {
    if (hiveActive()) {
      const s = Math.ceil((state.hive.tendedUntil - now) / 1000);
      hr.status.textContent = `🐝 buzzing · tended ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    } else {
      hr.status.textContent = "😴 idle — tend the hive!";
    }
  }
}

  updateCoopStatus();
}

// slow tick: honey drips in, bees come and go with the tending
function updateHive() {
  $("hive").hidden = !state.hive;
  if (!state.hive) return;
  const now = Date.now();
  $("hiveTag").textContent = hiveActive() ? "" : "😴";
  if (hiveActive() && now >= state.hive.honeyAt) {
    state.hive.honeyAt = now + HONEY_MS[0] + Math.random() * (HONEY_MS[1] - HONEY_MS[0]);
    state.barn.honey = (state.barn.honey || 0) + 1;
    sceneFloater("🍯 +1", 13.5, 53, "#b8860b");
    blip(660, 0.05, "sine", 0.04);
    save();
    renderHeader();
    renderCustomers();
  }
  // bees exist only while the hive is looked after
  if (hiveActive() && beeEls.length === 0) {
    for (let i = 0; i < 3; i++) {
      const el = document.createElement("div");
      el.className = "bee";
      el.textContent = "🐝";
      $("scene").appendChild(el);
      beeEls.push({ el, px: 13.5, py: 52, tx: 13.5, ty: 52, phase: i * 2.1 });
    }
  } else if (!hiveActive() && beeEls.length) {
    for (const b of beeEls) b.el.remove();
    beeEls = [];
  }
}

// every frame: bees flit between the plants they're pollinating
function moveBees(dt) {
  if (!beeEls.length) return;
  const t = performance.now() / 1000;
  for (const b of beeEls) {
    if (Math.hypot(b.tx - b.px, b.ty - b.py) < 1.5) {
      // pick a plant to visit, or drift over the field
      const planted = [];
      for (let i = 0; i < state.plotsOwned; i++) {
        if (state.plots[i] && !state.plots[i].dead) planted.push(i);
      }
      if (planted.length && Math.random() < 0.8) {
        const { x, y } = spotScenePos(planted[Math.floor(Math.random() * planted.length)]);
        b.tx = x + (Math.random() - 0.5) * 6;
        b.ty = y - 3 - Math.random() * 4;
      } else {
        b.tx = 14 + Math.random() * 62;
        b.ty = 46 + Math.random() * 42;
      }
    }
    const dx = b.tx - b.px, dy = b.ty - b.py;
    const d = Math.hypot(dx, dy) || 1;
    const step = Math.min(d, 17 * dt);
    b.px += dx / d * step;
    b.py += dy / d * step;
    const wob = Math.sin(t * 9 + b.phase) * 0.7;
    b.el.style.left = b.px + "%";
    b.el.style.top = (b.py + wob) + "%";
    b.el.style.zIndex = Math.round(b.py * 10) + 3;
    b.el.style.transform = `translate(-50%,-50%) scaleX(${dx < 0 ? -1 : 1})`;
  }
}

// ---------------- The crow ----------------
// rarely, a crow lands on a plant. Run at it to scare it off — dawdle
// (about ten seconds, but the crow keeps its own time) and it steals the plant.
const CROW_SVG = `<svg viewBox="0 0 46 38">
  <g class="cr-legL">
    <rect x="18.5" y="24" width="2.2" height="8" rx="1" fill="#5a5a66"/>
    <rect x="16.8" y="30.6" width="6" height="2" rx="1" fill="#4a4a55"/>
  </g>
  <g class="cr-legR">
    <rect x="25.5" y="24" width="2.2" height="8" rx="1" fill="#5a5a66"/>
    <rect x="23.8" y="30.6" width="6" height="2" rx="1" fill="#4a4a55"/>
  </g>
  <g class="cr-body">
    <path d="M9 19 L1 24 L11 25 Z" fill="#14141c"/>
    <path d="M8 19 Q8 9 22 8 Q32 7 34 14 Q35 20 28 24 L14 24 Q8 24 8 19 Z" fill="#1d1d26"/>
    <path d="M13 13 Q22 8 28 14 Q21 19 13 17 Z" fill="#31313e"/>
    <g class="cr-head">
      <path d="M29 16 Q30 9 35 8 L38 12 Q34 14 32 18 Z" fill="#1d1d26"/>
      <circle cx="35.5" cy="10" r="6" fill="#1d1d26"/>
      <path d="M41 8.4 L46 10.4 L41 12.6 Z" fill="#e6a23c"/>
      <circle cx="37.5" cy="8.6" r="1.9" fill="#fff"/>
      <circle cx="38.2" cy="8.6" r="0.95" fill="#111"/>
    </g>
  </g>
</svg>`;
const CROW_STEAL_MS = 10000;
let crow = null, crowEl = null, crowCooldown = 0;

function cawCaw() {
  blip(190, 0.09, "sawtooth", 0.06);
  setTimeout(() => blip(155, 0.12, "sawtooth", 0.05), 130);
}

function spawnCrow(forceI) {
  if (crow) return;
  const candidates = [];
  for (let i = 0; i < state.plotsOwned; i++) {
    if (state.plots[i] && !state.plots[i].dead) candidates.push(i);
  }
  if (!candidates.length) return;
  const i = forceI !== undefined ? forceI : candidates[Math.floor(Math.random() * candidates.length)];
  const { x, y } = spotScenePos(i);
  crow = { i, x: Math.min(104, x + 26), y: -10, tx: x + 1.5, ty: y, face: -1, state: "flying", landedAt: 0 };
  crowEl = document.createElement("div");
  crowEl.className = "crow flying";
  crowEl.innerHTML = `<div class="crshadow"></div><span class="stolen"></span>` + CROW_SVG;
  $("scene").appendChild(crowEl);
  cawCaw();
}

function fleeCrow(reason) {
  if (!crow || crow.state === "fleeing") return;
  crow.state = "fleeing";
  crow.face = 1;
  crowEl.className = "crow fleeing";
  cawCaw();
  if (reason === "scared") toast("🐦 You scared the crow away!");
}

function removeCrow() {
  if (crowEl) crowEl.remove();
  crow = null; crowEl = null;
  crowCooldown = Date.now() + 45000 + Math.random() * 75000;
}

// every frame: fly in, menace the plant, flee up and away
function moveCrow(dt) {
  if (!crow) return;
  if (crow.state === "flying") {
    const dx = crow.tx - crow.x, dy = crow.ty - crow.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) {
      crow.state = "ground";
      crow.landedAt = Date.now();
      crowEl.className = "crow ground";
    } else {
      const step = Math.min(d, 55 * dt);
      crow.x += dx / d * step;
      crow.y += dy / d * step;
      crow.face = dx < 0 ? -1 : 1;
    }
  } else if (crow.state === "ground") {
    // the farmer charging in scares it off
    const d = Math.hypot(farmer.x - crow.x, (farmer.y - crow.y) * 1.5);
    if (d < 12) fleeCrow("scared");
    // it struts about its prize between pecks, like a real crow
    let strutting = false;
    if (crow.mtx === undefined) { crow.mtx = crow.x; crow.mty = crow.y; crow.wait = 0; }
    const dxm = crow.mtx - crow.x, dym = crow.mty - crow.y;
    const dm = Math.hypot(dxm, dym);
    if (dm > 0.4) {
      const st = Math.min(dm, 3.6 * dt);
      crow.x += dxm / dm * st;
      crow.y += dym / dm * st;
      if (dxm < -0.05) crow.face = -1;
      else if (dxm > 0.05) crow.face = 1;
      strutting = true;
    } else if (Date.now() > (crow.wait || 0)) {
      crow.mtx = crow.tx + (Math.random() - 0.5) * 7;
      crow.mty = crow.ty + (Math.random() - 0.5) * 3;
      crow.wait = Date.now() + 900 + Math.random() * 1700;
    }
    crowEl.classList.toggle("walking", strutting);
  } else {
    crow.x += 34 * dt;
    crow.y -= 42 * dt;
    if (crow.y < -14 || crow.x > 112) { removeCrow(); return; }
  }
  const s = crow.state === "ground" ? farmerScale(Math.max(Y_MIN, Math.min(crow.y, Y_MAX))) : 1;
  crowEl.style.left = crow.x + "%";
  crowEl.style.top = crow.y + "%";
  crowEl.style.zIndex = Math.round(Math.max(0, crow.y) * 10) + 2;
  crowEl.style.transform = `translate(-50%, -90%) scale(${(s * crow.face).toFixed(3)}, ${s.toFixed(3)})`;
}

function setView(animals) {
  $("plantsBtn").classList.toggle("active", !animals);
  $("animalsBtn").classList.toggle("active", animals);
  $("coopPanel").hidden = !animals;
  if (animals) { $("mktPanel").hidden = true; $("mktBtn").classList.remove("open"); }
  renderCoop();
}

// ---------------- Season engine ----------------
function advanceSeason(now) {
  const name = state.season ? SEASONS[state.season.name].after : "spring";
  state.season = { name, until: now + SEASON_MS };
  applySeasonUI();
  const growing = Object.keys(CROPS).filter(k => CROPS[k].seasons.includes(name)).map(k => CROPS[k].emoji).join("");
  toast(SEASONS[name].msg);
  toast(`🌱 In season now: ${growing}`);
  renderSeeds();
  renderMarket();
  save();
}

// the world dresses for its age: tents or barns, flint or steel
function applyEraUI() {
  const sc = $("scene");
  for (let i = 0; i < ERAS.length; i++) sc.classList.remove("era-" + i);
  sc.classList.add("era-" + (state.era || 0));
}

function applySeasonUI() {
  const name = state.season ? state.season.name : "spring";
  const s = SEASONS[name];
  $("seasonBadge").textContent = `${s.icon} ${s.name}`;
  const scene = $("scene");
  for (const k of Object.keys(SEASONS)) scene.classList.remove("season-" + k);
  scene.classList.add("season-" + name);
}

// ---------------- Game loop ----------------
let lastGrow = Date.now();
let tickCount = 0;

function tick() {
  const now = Date.now();

  // the year turns, the sky changes, and the market moves
  if (!state.season || now >= state.season.until) advanceSeason(now);
  if (!state.weather || now >= state.weather.until) rollWeather(now);
  if (!state.demand || now >= state.demandUntil) rollDemand(now);
  updateForecastClock(now);
  const W = WEATHERS[state.weather.kind];

  // grow every healthy plant at the weather's pace (wet soil doubles it);
  // ailing plants are stuck until the farmer helps them
  const dt = Math.min(now - lastGrow, 3600000);
  lastGrow = now;
  let troubled = null;
  const died = [];
  for (let i = 0; i < state.plotsOwned; i++) {
    const p = state.plots[i];
    if (!p || p.dead || isReady(p)) continue;
    if (!inSeason(p.crop)) continue;   // out of season: dormant, and weather leaves it be
    if (!p.ail) {
      p.grown += dt * W.mult * (isWet(p) ? WATER_MULT : 1) * (p.tired ? 0.5 : 1)
                    * (flockBoosting() ? CHICK_BOOST : 1) * (hiveActive() ? BEE_BOOST : 1);
      // weather can strike a healthy growing plant (not one just helped)
      if (W.ail && !isReady(p) && now > (p.safe || 0) && Math.random() < W.rate * dt / 1000) {
        p.ail = W.ail;
        p.ailAt = now;
        troubled = i;
      }
    } else if (now - (p.ailAt || now) >= AIL_DEATH_MS) {
      // ignored too long — the plant is lost
      died.push({ crop: p.crop, via: p.ail });
      state.plots[i] = { crop: p.crop, dead: true };
    }
  }
  if (troubled !== null) {
    const { x, y } = spotScenePos(troubled);
    sceneFloater(AILS[state.plots[troubled].ail].tag, x, y, "#1976d2");
    blip(180, 0.1, "sawtooth", 0.03);
  }
  if (died.length) {
    blip(110, 0.3, "sawtooth", 0.05);
    toast(died.length === 1
      ? `💀 Your ${CROPS[died[0].crop].emoji} ${CROPS[died[0].crop].name} ${AILS[died[0].via].died}! Sweep it away to replant.`
      : `💀 ${died.length} plants died in the weather! Sweep them away to replant.`);
    save();
  }

  // rarely, a crow eyes up your crops
  if (!crow && now > crowCooldown && Math.random() < dt / 75000) spawnCrow();
  if (crow && crow.state === "ground") {
    const cp = state.plots[crow.i];
    if (!cp || cp.dead) fleeCrow("bored");   // its prize vanished
    else if (now - crow.landedAt >= CROW_STEAL_MS) {
      const emoji = CROPS[cp.crop].emoji;
      state.plots[crow.i] = null;
      crowEl.querySelector(".stolen").textContent = emoji;
      fleeCrow("stole");
      toast(`🐦 A crow stole your ${emoji}! Run at them faster next time!`);
      save();
      updateField();
    }
  }

  if (customers.length < MAX_QUEUE && now >= nextCustomerAt) {
    spawnCustomer();
    scheduleNextCustomer();
  }

  customers = customers.filter(c => {
    if (now - c.arrivedAt > PATIENCE_MS) {
      toast(`${c.face} got tired of waiting and left…`);
      return false;
    }
    return true;
  });

  // rescue: if totally broke with nothing growing and nothing in the barn,
  // grandma slips you a few dollars so the game can't get stuck
  const cheapest = Math.min(...Object.values(CROPS).map(c => c.cost));
  const growing = state.plots.some(p => p && !p.dead);
  const stored = Object.values(state.barn).some(n => n > 0);
  if (state.money < cheapest && !growing && !stored) {
    state.money += 5;
    toast("👵 Grandma slips you $5. \"Go plant something, dear!\"");
    save();
    renderHeader();
  }

  // autosave every ~5s so growth survives closing the page
  if (++tickCount % 12 === 0) save();

  updateField();
  renderCustomers();
  renderChickens();
  updateHive();
  if (!$("coopPanel").hidden) updateCoopStatus();
}

// farmer + customers move at full frame rate
let lastFrame = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastFrame) / 1000);
  lastFrame = t;
  updateFarmer(dt);
  moveCustomers(dt);
  moveChickens(dt);
  moveBees(dt);
  moveCrow(dt);
  requestAnimationFrame(frame);
}

// ---------------- Input ----------------
const KEYMAP = {
  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  a: "left", d: "right", w: "up", s: "down",
  A: "left", D: "right", W: "up", S: "down",
};
window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "e" || e.key === "E" || e.key === "Enter") {
    if (document.activeElement && document.activeElement.tagName === "BUTTON" && e.key !== " ") return;
    e.preventDefault();
    doAction();
    return;
  }
  const dir = KEYMAP[e.key];
  if (dir) { e.preventDefault(); farmer.keys.add(dir); }
});
window.addEventListener("keyup", (e) => {
  const dir = KEYMAP[e.key];
  if (dir) farmer.keys.delete(dir);
});
window.addEventListener("blur", () => farmer.keys.clear());

// touch joystick: press anywhere on the scene (not a button/customer) and drag
const sceneEl = $("scene");
const stickEl = $("stick");
const knobEl = $("knob");

sceneEl.addEventListener("touchstart", (e) => {
  if (e.target.closest(".action-btn, .cust, .mkt-btn, .mkt-panel, .view-toggle, .coop-panel")) return;
  const r = sceneEl.getBoundingClientRect();
  for (const t of e.changedTouches) {
    if (farmer.joy === null) {
      e.preventDefault();
      farmer.joy = { id: t.identifier, ox: t.clientX, oy: t.clientY, dx: 0, dy: 0 };
      stickEl.style.display = "block";
      stickEl.style.left = (t.clientX - r.left) + "px";
      stickEl.style.top = (t.clientY - r.top) + "px";
      knobEl.style.transform = "translate(0,0)";
    }
  }
}, { passive: false });

sceneEl.addEventListener("touchmove", (e) => {
  if (!farmer.joy) return;
  const r = sceneEl.getBoundingClientRect();
  for (const t of e.changedTouches) {
    if (t.identifier === farmer.joy.id) {
      e.preventDefault();
      const R = 40;          // knob travel
      const FULL = 22;       // deflection that already counts as full speed
      let dx = t.clientX - farmer.joy.ox;
      let dy = t.clientY - farmer.joy.oy;
      let m = Math.hypot(dx, dy);
      // floating stick: if the thumb overshoots, the base follows it,
      // so changing direction never requires dragging all the way back
      if (m > R) {
        farmer.joy.ox = t.clientX - dx / m * R;
        farmer.joy.oy = t.clientY - dy / m * R;
        dx = dx / m * R; dy = dy / m * R;
        m = R;
        stickEl.style.left = (farmer.joy.ox - r.left) + "px";
        stickEl.style.top = (farmer.joy.oy - r.top) + "px";
      }
      knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
      const dead = 4;
      if (m < dead) {
        farmer.joy.dx = 0; farmer.joy.dy = 0;
      } else {
        const speed = Math.min(1, m / FULL);   // full speed on a small drag
        farmer.joy.dx = dx / m * speed;
        farmer.joy.dy = dy / m * speed;
      }
    }
  }
}, { passive: false });

function endJoy(e) {
  if (!farmer.joy) return;
  for (const t of e.changedTouches) {
    if (t.identifier === farmer.joy.id) {
      farmer.joy = null;
      stickEl.style.display = "none";
    }
  }
}
sceneEl.addEventListener("touchend", endJoy);
sceneEl.addEventListener("touchcancel", endJoy);

// tap/click the grass to walk there
sceneEl.addEventListener("click", (e) => {
  if (e.target.closest(".action-btn, .spot, .cust, .mkt-btn, .mkt-panel, .view-toggle, .coop-panel")) return;
  const r = sceneEl.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 100;
  const y = (e.clientY - r.top) / r.height * 100;
  if (y < Y_MIN - 4) return;   // clicked the sky
  farmer.target = { x: Math.max(2, Math.min(98, x)), y: Math.max(Y_MIN, Math.min(Y_MAX, y)) };
});

$("actionBtn").addEventListener("pointerdown", (e) => { e.preventDefault(); doAction(); });
$("mktBtn").addEventListener("click", () => { toggleMarket(); if (!$("mktPanel").hidden) setView(false); });
$("plantsBtn").addEventListener("click", () => setView(false));
$("animalsBtn").addEventListener("click", () => setView(true));

// ---------------- Boot ----------------
$("reset").onclick = () => {
  if (confirm("Start a brand new farm? Your progress will be lost.")) {
    localStorage.removeItem(SAVE_KEY);
    state = freshState();
    for (const [, ce] of custEls) ce.el.remove();
    custEls.clear();
    for (const [, el] of chickEls) el.remove();
    chickEls.clear();
    for (const b of beeEls) b.el.remove();
    beeEls = [];
    $("hive").hidden = true;
    if (crowEl) { crowEl.remove(); crow = null; crowEl = null; }
    setView(false);
    customers = [];
    selectedSeed = "wheat";
    for (const s of spotEls) { s.sig = ""; s.plantbox.innerHTML = ""; s.plantEl = null; }
    lastNear = "?";
    applyWeatherUI();
    applySeasonUI();
    applyEraUI();
    scheduleNextCustomer();
    renderAll();
    toast("🌅 A fresh start on a tiny farm!");
  }
};

state = load() || freshState();
nextChickId = state.chickens.reduce((m, c) => Math.max(m, c.id + 1), 1);
buildField();
applyWeatherUI();
applySeasonUI();
applyEraUI();
scheduleNextCustomer();
renderAll();
toast("🌾 Welcome! Grow crops, chop them down, and sell to the folks at your stand.");
setInterval(tick, 400);
requestAnimationFrame(frame);
</script>
</body>
