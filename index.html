<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌾 Tiny Farm</title>
<style>
  :root {
    --wood: #8b5a2b;
    --wood-dark: #5e3c1d;
    --plank: #a9743f;
    --plank-dark: #96662f;
    --cream: #fff6e3;
    --ink: #3d2c1e;
    --gold: #f2b705;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(180deg, #bfe3f7 0%, #d9edc8 55%, #a8d178 100%);
    color: var(--ink);
    padding: 8px;
    height: 100dvh;
    display: flex;
  }
  .game {
    flex: 1;
    max-width: 1500px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }

  /* ---------- Wooden panels ---------- */
  .wood-panel {
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0 2px, transparent 2px 70px),
      linear-gradient(180deg, var(--plank), var(--plank-dark));
    border: 4px solid var(--wood-dark);
    border-radius: 14px;
    box-shadow: 0 4px 0 rgba(62,38,15,0.8), inset 0 2px 0 rgba(255,255,255,0.25);
    color: var(--cream);
  }

  /* ---------- Compact header ---------- */
  header {
    padding: 5px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
    flex-shrink: 0;
  }
  header h1 { font-size: 1.15rem; text-shadow: 0 2px 0 rgba(0,0,0,0.3); white-space: nowrap; }
  .money {
    font-size: 1.1rem; font-weight: bold; color: var(--ink);
    background: linear-gradient(180deg, #ffe082, #ffca28);
    border: 3px solid #b8860b; border-radius: 999px;
    padding: 2px 14px; box-shadow: 0 2px 0 #8d6708;
    transition: transform 0.15s; white-space: nowrap;
  }
  .money.pop { transform: scale(1.22); }
  .barn-inv { display: flex; gap: 6px; align-items: center; margin-left: auto; overflow: hidden; }
  .barn-inv .item {
    background: var(--cream); color: var(--ink);
    border: 2px solid var(--wood-dark); border-radius: 8px;
    padding: 1px 7px; font-size: 0.92rem; white-space: nowrap;
    box-shadow: 0 2px 0 rgba(62,38,15,0.6);
  }
  .reset-btn {
    font-family: inherit; font-size: 1rem; color: var(--cream);
    background: none; border: 2px solid rgba(255,246,227,0.5); border-radius: 8px;
    width: 30px; height: 30px; cursor: pointer; flex-shrink: 0;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.12); }

  /* ============================================================
     THE FARM SCENE — one continuous landscape you walk around in
     ============================================================ */
  .scene {
    position: relative;
    flex: 1;
    min-height: 0;
    border: 6px solid var(--wood-dark);
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(180deg, #7ec8f2 0%, #aadcf7 26%, #d7efff 40%);
    box-shadow: 0 5px 0 rgba(62,38,15,0.8);
    touch-action: none;
  }

  /* sky */
  .sun {
    position: absolute; top: 4%; right: 6%;
    width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle, #fff7ae 30%, #ffd54f 60%, rgba(255,213,79,0) 72%);
    box-shadow: 0 0 50px 22px rgba(255,230,120,0.55);
    animation: sunPulse 4s ease-in-out infinite alternate;
  }
  @keyframes sunPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  .cloud { position: absolute; font-size: 44px; opacity: 0.9; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.08)); }
  .cloud.c1 { top: 3%; animation: drift 70s linear infinite; }
  .cloud.c2 { top: 13%; font-size: 30px; animation: drift 95s linear infinite; animation-delay: -40s; }
  .cloud.c3 { top: 1%; font-size: 24px; animation: drift 120s linear infinite; animation-delay: -70s; }
  @keyframes drift { from { left: -80px; } to { left: 105%; } }

  /* rolling hills on the horizon */
  .hill { position: absolute; border-radius: 50%; }
  .hill.h1 { left: -18%; top: 25%; width: 75%; height: 22%; background: #79ad4c; }
  .hill.h2 { right: -22%; top: 23%; width: 85%; height: 26%; background: #6da23e; }
  .hill.h3 { left: 28%; top: 28%; width: 66%; height: 18%; background: #82b656; }

  /* the meadow */
  .grass {
    position: absolute; left: 0; right: 0; top: 35%; bottom: 0;
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,0.045) 0 70px, transparent 70px 140px),
      linear-gradient(180deg, #6da23e 0%, #79b046 22%, #85bb4f 55%, #8fc258 100%);
  }

  .horizon-tree { position: absolute; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.15)); z-index: 2; }

  /* the barn */
  .barn { position: absolute; left: 3.5%; top: 18%; width: 132px; height: 96px; z-index: 2; filter: drop-shadow(0 5px 4px rgba(0,0,0,0.18)); }
  .barn .body {
    position: absolute; bottom: 0; left: 8px; width: 116px; height: 58px;
    background: linear-gradient(180deg, #d94f37, #c04028);
    border: 3px solid #7e2517; border-top: none; border-radius: 0 0 6px 6px;
  }
  .barn .roof {
    position: absolute; bottom: 52px; left: 0; width: 132px; height: 42px;
    background: linear-gradient(180deg, #8d3b2b, #79301f);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .barn .door {
    position: absolute; bottom: 3px; left: 46px; width: 40px; height: 40px;
    background: #f6e7c8; border: 3px solid #7e2517; border-radius: 6px 6px 0 0;
  }
  .barn .door::before, .barn .door::after {
    content: ""; position: absolute; top: -2px; left: 15px; width: 4px; height: 38px;
    background: #7e2517; transform: rotate(45deg);
  }
  .barn .door::after { transform: rotate(-45deg); }
  .barn .loft {
    position: absolute; bottom: 62px; left: 56px; width: 20px; height: 16px;
    background: #f6e7c8; border: 3px solid #7e2517; border-radius: 50% 50% 0 0; z-index: 1;
  }
  .tractor { position: absolute; left: 15%; top: 28%; font-size: 30px; z-index: 2; transform: scaleX(-1); filter: drop-shadow(0 3px 3px rgba(0,0,0,0.2)); }
  .chicken { position: absolute; left: 6%; top: 50%; font-size: 24px; z-index: 3; animation: peck 2.6s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes peck {
    0%, 55%, 100% { transform: rotate(0deg); }
    62%, 76% { transform: rotate(24deg) translateY(3px); }
    69% { transform: rotate(10deg); }
  }
  .flower { position: absolute; z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15)); }

  /* the field — a single trapezoid of tilled earth drawn in perspective */
  .field-layer { position: absolute; left: 10%; width: 68%; top: 40%; height: 55%; }
  .field-dirt { clip-path: polygon(17% 0%, 83% 0%, 98% 100%, 2% 100%); }
  .soil {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(180deg, #8a5a33 0 24px, #75482a 24px 32px);
    border-radius: 45% 45% 0 0 / 26px;
    box-shadow: inset 0 10px 18px rgba(46,28,12,0.5), inset 0 -8px 14px rgba(46,28,12,0.35);
    border-top: 5px solid #9c6a3c;
    transition: top 0.7s ease;
  }
  .fence {
    position: absolute; left: -1%; right: -1%; bottom: -5%; height: 26px; z-index: 970;
    background: repeating-linear-gradient(90deg, #8b5a2b 0 7px, transparent 7px 48px);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.2));
    pointer-events: none;
  }
  .fence::before, .fence::after {
    content: ""; position: absolute; left: 0; right: 0; height: 5px;
    background: #9c6a3c; border-radius: 3px;
  }
  .fence::before { top: 5px; }
  .fence::after { top: 15px; }

  /* planting spots — dirt mounds in the field, not tiles */
  .spot { position: absolute; width: 0; height: 0; cursor: pointer; }
  .spot.hidden { display: none; }
  .spot .mound {
    position: absolute; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 42%, #5b3a1e 0%, #4a2f18 45%, rgba(74,47,24,0) 72%);
    transition: box-shadow 0.15s;
  }
  .spot.near .mound, .spot.stage-empty:hover .mound {
    background: radial-gradient(ellipse at 50% 42%, #6b4523 0%, #543619 45%, rgba(74,47,24,0) 72%);
    box-shadow: 0 0 0 3px rgba(255,235,59,0.75);
  }
  .spot.locked .mound { display: none; }
  .spot.locked.near .weed-glyph { text-shadow: 0 0 8px rgba(255,235,59,0.9); }
  .sprite {
    position: absolute; left: 0; bottom: -4px; width: 110px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
  }
  .weed-glyph { line-height: 1.05; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.28)); }
  .bar {
    display: none; height: 6px; margin-bottom: 4px;
    background: rgba(0,0,0,0.4); border-radius: 3px; overflow: hidden;
  }
  .spot.growing .bar { display: block; }
  .bar span { display: block; height: 100%; background: #aeea00; border-radius: 3px; }

  /* ------- real growing plants ------- */
  .plant {
    position: relative;
    transform-origin: bottom center;
    transition: transform 0.45s linear;
    pointer-events: auto;
  }
  .plant .sway { position: absolute; inset: 0; transform-origin: bottom center; }
  .spot.ready .plant .sway { animation: sway 2.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  .plant.shake .sway { animation: shake 0.3s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-7deg) translateX(-2px); }
    65% { transform: rotate(6deg) translateX(2px); }
  }
  .stem {
    position: absolute; bottom: 0;
    transform-origin: bottom center;
    border-radius: 45% 45% 0 0 / 60% 60% 0 0;
    background: linear-gradient(180deg, #7cb342, #4e7d29);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.2));
  }
  .plant.ripe-gold .stem { background: linear-gradient(180deg, #eccd6c, #b98e2f); }
  .stem.stake { background: linear-gradient(180deg, #a97a4a, #7a5228); border-radius: 2px; }
  .leafball {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #82c853, #4c8a28 72%);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.18));
  }
  .cornleaf {
    position: absolute; bottom: 0;
    width: 16px; height: 30px;
    background: #5f9e34;
    border-radius: 0 100% 0 100%;
    transform-origin: bottom right;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
  }
  .cornleaf.flip { border-radius: 100% 0 100% 0; transform-origin: bottom left; }
  .fruit {
    position: absolute; transform: translateX(-50%) scale(0);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.28));
    line-height: 1;
  }
  .plant.fruited .fruit { transform: translateX(-50%) scale(1); }
  .spot.ready .sprite::after {
    content: "✨"; position: absolute; top: -14px; right: 22px; font-size: 15px;
    animation: twinkle 1s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.4; transform: scale(0.8); } to { opacity: 1; transform: scale(1.15); } }

  /* crop falling when chopped */
  .chopped {
    position: absolute; z-index: 980; pointer-events: none;
    transform-origin: bottom center; line-height: 1;
    animation: chopfall 0.65s ease-in forwards;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.3));
  }
  @keyframes chopfall {
    0% { transform: translateX(-50%) rotate(0deg); opacity: 1; }
    55% { transform: translateX(-50%) rotate(78deg); opacity: 1; }
    100% { transform: translateX(-50%) rotate(84deg) translateY(6px); opacity: 0; }
  }

  /* ------- the farmer ------- */
  #farmer { position: absolute; pointer-events: none; }
  #farmer .fshadow {
    position: absolute; left: 50%; bottom: -2px;
    width: 34px; height: 10px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.28), rgba(0,0,0,0) 70%);
    border-radius: 50%;
  }
  #farmer .fbody {
    display: block; font-size: 46px; line-height: 1;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,0.25));
  }
  #farmer.walking .fbody { animation: hop 0.28s ease-in-out infinite alternate; }
  @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  #farmer .axe {
    position: absolute; right: -12px; top: 2px; font-size: 24px;
    opacity: 0; transform-origin: 20% 85%;
  }
  #farmer.chopping .axe { opacity: 1; animation: swing 0.32s ease-in-out; }
  @keyframes swing {
    0% { transform: rotate(-95deg); }
    60% { transform: rotate(28deg); }
    100% { transform: rotate(10deg); }
  }

  /* ------- the market stand & customers in the scene ------- */
  .stand { position: absolute; left: 91%; top: 52%; width: 104px; height: 86px; transform: translate(-50%, -100%); z-index: 520; pointer-events: none; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.2)); }
  .stand .awning {
    position: absolute; top: 0; left: 0; right: 0; height: 30px;
    background: repeating-linear-gradient(90deg, #e53935 0 16px, #fdfdfd 16px 32px);
    border: 3px solid var(--wood-dark); border-radius: 10px 10px 4px 4px;
  }
  .stand .awning::after {
    content: ""; position: absolute; left: -3px; right: -3px; bottom: -8px; height: 8px;
    background: repeating-linear-gradient(90deg, #e53935 0 16px, #fdfdfd 16px 32px);
    clip-path: polygon(0 0, 100% 0, 100% 40%, 87.5% 100%, 75% 40%, 62.5% 100%, 50% 40%, 37.5% 100%, 25% 40%, 12.5% 100%, 0 40%);
  }
  .stand .counter {
    position: absolute; bottom: 0; left: 10px; right: 10px; height: 34px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, var(--plank), var(--plank-dark));
    border: 3px solid var(--wood-dark); border-radius: 4px;
  }
  .stand .legL, .stand .legR { position: absolute; bottom: 30px; width: 6px; height: 26px; background: #7a5028; border: 2px solid var(--wood-dark); }
  .stand .legL { left: 14px; } .stand .legR { right: 14px; }
  .stand .basket { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); font-size: 22px; }

  .cust { position: absolute; cursor: pointer; }
  .cin { position: relative; display: flex; flex-direction: column; align-items: center; }
  .cbody { font-size: 40px; line-height: 1; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.25)); }
  .cust.moving .cbody { animation: hop 0.3s ease-in-out infinite alternate; }
  .cust .cshadow {
    position: absolute; left: 50%; bottom: -3px;
    width: 30px; height: 9px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.25), rgba(0,0,0,0) 70%);
    border-radius: 50%;
  }
  .bubble {
    position: absolute; bottom: calc(100% + 8px); right: -6px;
    background: #fffdf6; color: var(--ink);
    border: 2px solid #cfa76f; border-radius: 12px;
    padding: 5px 9px 7px;
    font-size: 14px; line-height: 1.25; white-space: nowrap;
    box-shadow: 0 3px 0 rgba(90,60,25,0.35);
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .bubble b { font-size: 15px; }
  .bubble::after {
    content: ""; position: absolute; bottom: -8px; right: 18px;
    width: 12px; height: 12px; background: #fffdf6;
    border-right: 2px solid #cfa76f; border-bottom: 2px solid #cfa76f;
    transform: rotate(45deg) skew(12deg, 12deg);
  }
  .cust.can-sell .bubble {
    border-color: #43a047;
    box-shadow: 0 3px 0 rgba(90,60,25,0.35), 0 0 0 3px rgba(102,187,106,0.55);
    animation: sellPulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes sellPulse { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .cust.near .bubble { box-shadow: 0 3px 0 rgba(90,60,25,0.35), 0 0 0 3px rgba(255,235,59,0.85); }
  .cust.leaving { transition: opacity 0.45s; opacity: 0; }
  .pbar {
    display: block; height: 4px; margin-top: 4px;
    background: rgba(0,0,0,0.15); border-radius: 2px; overflow: hidden;
  }
  .pbar span { display: block; height: 100%; background: #66bb6a; border-radius: 2px; }

  /* ------- touch controls ------- */
  .stick {
    position: absolute; z-index: 1000; display: none;
    width: 96px; height: 96px; margin: -48px 0 0 -48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 3px solid rgba(255,255,255,0.45);
    pointer-events: none;
  }
  .stick .knob {
    position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.65);
    border: 3px solid rgba(120,90,40,0.5);
    box-shadow: 0 3px 6px rgba(0,0,0,0.25);
  }
  .action-btn {
    position: absolute; right: 12px; bottom: 12px; z-index: 1001;
    width: 64px; height: 64px; border-radius: 50%;
    font-size: 28px; font-family: inherit;
    background: linear-gradient(180deg, #ffe082, #ffca28);
    border: 4px solid #b8860b;
    box-shadow: 0 4px 0 #8d6708, 0 6px 12px rgba(0,0,0,0.25);
    cursor: pointer;
    transition: transform 0.1s, filter 0.2s;
  }
  .action-btn:active { transform: scale(0.92); }
  .action-btn.idle { filter: grayscale(0.9) opacity(0.55); }

  /* ---------- Bottom bar: seeds + land + hint, one row ---------- */
  .bottombar {
    flex-shrink: 0;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .seeds { display: flex; gap: 6px; flex-wrap: nowrap; }
  .seed-btn, .land-btn {
    font-family: inherit; font-size: 0.72rem; color: var(--ink);
    background: linear-gradient(180deg, #fffbe8, #f3e5c0);
    border: 3px solid #c9a86a; border-radius: 10px;
    padding: 3px 7px; cursor: pointer; text-align: center; line-height: 1.25;
    box-shadow: 0 2px 0 rgba(90,60,25,0.5);
    transition: transform 0.1s;
    white-space: nowrap;
  }
  .seed-btn:hover, .land-btn:hover { transform: translateY(-2px); }
  .seed-btn.selected {
    border-color: var(--gold);
    background: linear-gradient(180deg, #fff7c9, #ffe082);
    box-shadow: 0 2px 0 #b8860b, 0 0 0 2px var(--gold);
  }
  .seed-btn.locked { filter: grayscale(1); opacity: 0.55; cursor: not-allowed; }
  .seed-btn .big, .land-btn .big { font-size: 1.25rem; display: block; }
  .land-btn {
    color: var(--cream);
    background: linear-gradient(180deg, #b07c46, #96662f);
    border-color: var(--wood-dark);
    box-shadow: 0 2px 0 rgba(62,38,15,0.7);
  }
  .land-btn b { color: #ffe082; }
  .land-btn.sold-out { display: none; }
  .hintmini {
    margin-left: auto;
    font-size: 0.78rem;
    line-height: 1.45;
    text-align: right;
    color: #f7e7c6;
  }
  @media (max-width: 860px) { .hintmini { display: none; } }

  /* ---------- Toasts & floaters ---------- */
  #toasts {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 6px; z-index: 1100; pointer-events: none;
  }
  .toast {
    background: rgba(61,44,30,0.92); color: #fff8ec;
    padding: 8px 18px; border-radius: 999px; font-size: 0.95rem;
    animation: toastin 0.25s ease-out;
  }
  @keyframes toastin { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .floater {
    position: fixed; font-weight: bold; font-size: 1.1rem;
    pointer-events: none; z-index: 1200;
    animation: floatup 1s ease-out forwards;
    text-shadow: 0 1px 0 rgba(255,255,255,0.7);
  }
  @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-46px); } }
</style>
</head>
<body>
<div class="game">
  <header class="wood-panel">
    <h1>🌾 Tiny Farm</h1>
    <div class="money" id="money">$0</div>
    <div class="barn-inv" id="barnInv"></div>
    <button class="reset-btn" id="reset" title="Start over">↺</button>
  </header>

  <div class="scene" id="scene">
    <div class="sun"></div>
    <div class="cloud c1">☁️</div>
    <div class="cloud c2">☁️</div>
    <div class="cloud c3">☁️</div>
    <div class="hill h1"></div>
    <div class="hill h2"></div>
    <div class="hill h3"></div>
    <div class="grass"></div>
    <div class="horizon-tree" style="left:25%; top:24%; font-size:34px;">🌳</div>
    <div class="horizon-tree" style="left:62%; top:22%; font-size:42px;">🌳</div>
    <div class="horizon-tree" style="left:84%; top:25%; font-size:30px;">🌲</div>
    <div class="horizon-tree" style="left:1%;  top:58%; font-size:56px;">🌳</div>
    <div class="barn">
      <div class="roof"></div>
      <div class="loft"></div>
      <div class="body"></div>
      <div class="door"></div>
    </div>
    <div class="tractor">🚜</div>
    <div class="chicken">🐓</div>
    <div class="flower" style="left:8%;  top:70%; font-size:18px;">🌻</div>
    <div class="flower" style="left:4%;  top:88%; font-size:16px;">🌼</div>
    <div class="flower" style="left:82%; top:44%; font-size:14px;">🌷</div>
    <div class="flower" style="left:5%;  top:44%; font-size:14px;">🌼</div>
    <div class="flower" style="left:80%; top:96%; font-size:16px;">🍄</div>
    <div class="flower" style="left:24%; top:37%; font-size:12px;">🌼</div>

    <div class="field-layer field-dirt">
      <div class="soil" id="soil"></div>
    </div>

    <div class="stand">
      <div class="awning"></div>

    <div id="farmer">
      <div class="fshadow"></div>

      <span class="fbody">🧑‍🌾</span>

    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>

  <div class="bottombar wood-panel">
    <div class="seeds" id="seeds"></div>
    <div class="hintmini">
      🕹️ <b>WASD/arrows</b> walk · <b>Space</b> plant/chop/sell<br>
      📱 left thumb = walk, gold button = act · tap a customer to sell
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";

// ---------------- Crop definitions ----------------
// unlockPlots: how many plots you must own before this seed appears in the shop
// chops: how many axe swings to harvest — big crops take more
const CROPS = {
  wheat:      { name: "Wheat",      emoji: "🌾", cost: 2,  growMs: 15000,  sell: 5,   unlockPlots: 0,  chops: 1 },
  carrot:     { name: "Carrot",     emoji: "🥕", cost: 5,  growMs: 30000,  sell: 12,  unlockPlots: 0,  chops: 1 },
  tomato:     { name: "Tomato",     emoji: "🍅", cost: 12, growMs: 50000,  sell: 26,  unlockPlots: 6,  chops: 2 },
  corn:       { name: "Corn",       emoji: "🌽", cost: 20, growMs: 75000,  sell: 45,  unlockPlots: 9,  chops: 2 },
  pumpkin:    { name: "Pumpkin",    emoji: "🎃", cost: 35, growMs: 110000, sell: 80,  unlockPlots: 12, chops: 3 },
  strawberry: { name: "Strawberry", emoji: "🍓", cost: 60, growMs: 150000, sell: 140, unlockPlots: 16, chops: 2 },
};

// how each crop LOOKS as a living plant: w/h = full-grown size (px, front row),
// stems: [leftPx, widthPx, tiltDeg, heightFrac], balls: leafy clumps [xPct, bottomPct, sizePx],
// fruit: the produce that pops out near the end of growth
const PLANTS = {
  wheat: {
    w: 30, h: 52, goldWhenRipe: true,
    stems: [[3,3,-9,0.85],[9,3,-4,0.95],[14,3,0,1],[19,3,4,0.9],[25,3,9,0.8]],
    balls: [],
    fruit: { e: "🌾", size: 26, x: 50, bottom: 62 },
  },
  carrot: {
    w: 30, h: 26,
    stems: [[6,3,-26,0.9],[11,3,-10,1],[15,3,2,0.95],[20,3,14,0.9],[24,3,28,0.8]],
    balls: [],
    fruit: { e: "🥕", size: 18, x: 50, bottom: -12 },
  },
  tomato: {
    w: 36, h: 58,
    stems: [[16,5,0,1]], stake: true,
    balls: [[30,34,20],[62,52,22],[46,74,19],[58,20,16]],
    fruit: { e: "🍅", size: 19, x: 42, bottom: 38 },
  },
  corn: {
    w: 34, h: 84,
    stems: [[15,6,0,1]],
    cornleaves: [[0.32,-1],[0.55,1],[0.74,-1]],
    balls: [],
    fruit: { e: "🌽", size: 24, x: 66, bottom: 46 },
  },
  pumpkin: {
    w: 52, h: 30,
    stems: [[14,4,-18,0.8],[20,4,6,1]],
    balls: [[26,40,18],[52,26,16]],
    fruit: { e: "🎃", size: 34, x: 74, bottom: -8 },
  },
  strawberry: {
    w: 38, h: 26,
    stems: [],
    balls: [[28,18,20],[54,28,22],[74,14,18]],
    fruit: { e: "🍓", size: 17, x: 46, bottom: 26 },
  },
};

const GRID = 25;             // 25 planting spots in the field (5 per row, front row first)
const COLS = 5;
const START_PLOTS = 4;
const START_MONEY = 15;
const MAX_QUEUE = 4;
const PATIENCE_MS = 90000;
const FACES = ["👩‍🌾","👨","🧑‍🦰","👵","👴","🧒","👱‍♀️","🧔","👩‍🦱","🧓"];

// fake-3D layout: row 0 is the front (nearest, biggest), row 4 the back
const ROW_TOP    = [88, 70, 54, 40, 28];   // % down the field layer
const ROW_SCALE  = [1.00, 0.88, 0.77, 0.67, 0.58];
const ROW_SPREAD = [1.00, 0.91, 0.82, 0.73, 0.64];

// where the field layer sits inside the scene (must match the CSS above)
const FIELD_LEFT = 10, FIELD_WIDTH = 68, FIELD_TOP = 40, FIELD_HEIGHT = 55;

// where customers queue up by the market stand (scene %, front of queue first)
const QUEUE_SLOTS = [
  { x: 90, y: 63 },
  { x: 87, y: 75 },
  { x: 84, y: 87 },
  { x: 81, y: 98 },
];

// ---------------- State ----------------
let state = null;
let customers = [];          // { id, face, crop, qty, arrivedAt, px, py }
let selectedSeed = "wheat";
let nextCustomerAt = 0;
let customerId = 0;

function freshState() {
  return {
    money: START_MONEY,
    plotsOwned: START_PLOTS,
    // each plot: null (empty soil) or { crop, plantedAt, chopsLeft? }
    plots: Array.from({ length: GRID }, () => null),
    barn: {},                // harvested crops: { wheat: 3, ... }
  };
}

function landPrice() {
  return Math.round(20 * Math.pow(1.45, state.plotsOwned - START_PLOTS));
}

// ---------------- Save / load ----------------
const SAVE_KEY = "tiny-farm-save";
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s.money === "number" && Array.isArray(s.plots)) return s;
    }
  } catch (e) { /* corrupted save — start fresh */ }
  return null;
}

// ---------------- Tiny sounds ----------------
let audioCtx = null;
function blip(freq, dur = 0.08, type = "square", vol = 0.04) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* no audio available */ }
}
const sndPlant   = () => blip(330, 0.07);
const sndChop    = () => blip(220, 0.06, "square", 0.05);
const sndHarvest = () => { blip(520, 0.06); setTimeout(() => blip(660, 0.08), 60); };
const sndSell    = () => { blip(660, 0.06); setTimeout(() => blip(880, 0.1), 70); };
const sndBuy     = () => blip(440, 0.12, "triangle");
const sndNope    = () => blip(140, 0.15, "sawtooth");

// ---------------- UI helpers ----------------
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

function floater(text, x, y, color = "#2e7d32") {
  const el = document.createElement("div");
  el.className = "floater";
  el.textContent = text;
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.color = color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

// floaters anchored to a point in the scene
function sceneFloater(text, sx, sy, color) {
  const r = $("scene").getBoundingClientRect();
  floater(text, r.left + r.width * sx / 100, r.top + r.height * sy / 100 - 40, color);
}

function popMoney() {
  const el = $("money");
  el.classList.remove("pop");
  void el.offsetWidth;
  el.classList.add("pop");
}

function unlockedCrops() {
  return Object.keys(CROPS).filter(k => state.plotsOwned >= CROPS[k].unlockPlots);
}

// deterministic per-spot jitter so the field looks hand-planted, not gridded
function jitter(i, mag) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return ((x - Math.floor(x)) * 2 - 1) * mag;
}

// ---------------- The field ----------------
let spotEls = [];

function spotPosition(i) {
  const row = Math.floor(i / COLS);
  const col = i % COLS;
  const left = 50 + (col - 2) * 19 * ROW_SPREAD[row] + jitter(i, 2.2) * ROW_SCALE[row];
  const top = ROW_TOP[row] + jitter(i * 7 + 3, 1.6);
  return { left, top, row };
}

// spot position in scene coordinates (%)
function spotScenePos(i) {
  const { left, top } = spotPosition(i);
  return { x: FIELD_LEFT + left * FIELD_WIDTH / 100, y: FIELD_TOP + top * FIELD_HEIGHT / 100 };
}

function rowsOwned() {
  return Math.ceil(state.plotsOwned / COLS);
}

function buildPlantHTML(crop, scale) {
  const p = PLANTS[crop];
  const w = p.w * scale, h = p.h * scale;
  let inner = "";
  for (const [x, sw, tilt, hf] of p.stems || []) {
    inner += `<i class="stem${p.stake ? " stake" : ""}" style="left:${x * scale}px; width:${Math.max(2, sw * scale)}px; height:${Math.round(hf * 100)}%; transform: rotate(${tilt}deg);"></i>`;
  }
  for (const [frac, flip] of p.cornleaves || []) {
    const side = flip > 0 ? "left:" + (17 * scale) + "px" : "left:" + (1 * scale) + "px";
    inner += `<i class="cornleaf${flip > 0 ? " flip" : ""}" style="${side}; bottom:${Math.round(frac * 100)}%; width:${16 * scale}px; height:${28 * scale}px;"></i>`;
  }
  for (const [x, b, d] of p.balls || []) {
    const dd = d * scale;
    inner += `<i class="leafball" style="left:${x}%; bottom:${b}%; width:${dd}px; height:${dd}px; margin-left:${-dd / 2}px;"></i>`;
  }
  const f = p.fruit;
  inner += `<span class="fruit" style="left:${f.x}%; bottom:${f.bottom * scale}px; font-size:${Math.round(f.size * scale)}px;">${f.e}</span>`;
  return `<div class="plant plant-${crop}" style="width:${w}px; height:${h}px;"><div class="sway">${inner}</div></div>`;
}

function buildField() {
  const field = $("fieldSpots");
  spotEls = [];
  for (let i = 0; i < GRID; i++) {
    const { left, top, row } = spotPosition(i);
    const s = ROW_SCALE[row];
    const sceneY = FIELD_TOP + top * FIELD_HEIGHT / 100;
    const el = document.createElement("div");
    el.className = "spot";
    el.style.left = left + "%";
    el.style.top = top + "%";
    el.style.zIndex = Math.round(sceneY * 10);   // nearer things draw on top
    el.innerHTML = `
      <div class="mound" style="left:${-30 * s}px; top:${-17 * s}px; width:${60 * s}px; height:${34 * s}px;"></div>
      <div class="sprite">
        <span class="bar" style="width:${38 * s}px;"><span></span></span>
        <span class="plantbox"></span>
        <span class="weed-glyph"></span>
      </div>`;
    el.addEventListener("click", (ev) => { ev.stopPropagation(); walkToSpot(i); });
    field.appendChild(el);
    spotEls.push({
      el,
      scale: s,
      plantbox: el.querySelector(".plantbox"),
      weed: el.querySelector(".weed-glyph"),
      barFill: el.querySelector(".bar span"),
      sig: "",
      plantEl: null,
    });
  }
}

function updateField() {
  const now = Date.now();
  const rows = rowsOwned();

  // the tilled soil covers only the rows you own — it visibly grows with your farm
  $("soil").style.top = (ROW_TOP[rows - 1] - 13) + "%";

  for (let i = 0; i < GRID; i++) {
    const s = spotEls[i];
    let sig, cls = "spot", barPct = -1;
    let prog = 0, crop = null;

    if (i >= state.plotsOwned) {
      const inSoil = Math.floor(i / COLS) < rows;
      sig = inSoil ? "weed" : "hidden";
      cls += inSoil ? " locked" : " hidden";
    } else {
      const p = state.plots[i];
      if (!p) {
        sig = "empty";
        cls += " stage-empty";
      } else {
        crop = p.crop;
        const c = CROPS[crop];
        prog = Math.min(1, (now - p.plantedAt) / c.growMs);
        if (prog >= 1) { sig = "ready:" + crop; cls += " ready"; }
        else { sig = "grow:" + crop; cls += " growing"; barPct = Math.round(prog * 100); }
      }
    }

    if (s.sig !== sig) {
      const kind = sig.split(":")[0];
      const prevKind = s.sig.split(":")[0];
      s.sig = sig;
      s.el.className = cls + (s.el.classList.contains("near") ? " near" : "");
      s.weed.textContent = kind === "weed" ? (i % 2 ? "🌿" : "🪨") : "";
      if (kind === "weed") s.weed.style.fontSize = Math.round(20 * s.scale) + "px";
      if (kind === "grow" || kind === "ready") {
        if (!(prevKind === "grow" || prevKind === "ready") || !s.plantEl || !s.plantEl.classList.contains("plant-" + crop)) {
          s.plantbox.innerHTML = buildPlantHTML(crop, s.scale);
          s.plantEl = s.plantbox.querySelector(".plant");
        }
      } else if (s.plantEl) {
        s.plantbox.innerHTML = "";
        s.plantEl = null;
      }
    }

    // continuous growth: the whole plant scales up from a seedling
    if (s.plantEl) {
      const k = 0.15 + 0.85 * prog;
      s.plantEl.style.transform = `scale(${k.toFixed(3)})`;
      s.plantEl.classList.toggle("fruited", prog >= 0.8);
      if (PLANTS[crop].goldWhenRipe) s.plantEl.classList.toggle("ripe-gold", prog >= 0.95);
    }
    if (barPct >= 0) s.barFill.style.width = barPct + "%";
  }

  const landBtn = $("landBtn");
  if (landBtn) {
    if (state.plotsOwned >= GRID) {
      landBtn.classList.add("sold-out");
    } else {
      landBtn.classList.remove("sold-out");
      landBtn.querySelector("b").textContent = "$" + landPrice();
    }
  }
}

// ---------------- The farmer ----------------
const farmer = {
  x: 50, y: 82,            // scene %
  facing: 1,
  target: null,            // { x, y, spot } walk-to destination
  chopUntil: 0,
  keys: new Set(),
  joy: null,               // { id, ox, oy, dx, dy } active touch joystick
};
const Y_MIN = 39, Y_MAX = 97;
const SPEED_X = 40, SPEED_Y = 30;    // walk speed, scene % per second

function farmerScale(y) {
  return 0.55 + (y - Y_MIN) / (Y_MAX - Y_MIN) * 0.5;
}

// what the farmer could act on right now: nearest mound/crop/weed/customer in reach
function nearestTarget() {
  let best = null, bestD = 13;       // interaction radius in scene % — generous on purpose
  const consider = (x, y, kind, idx) => {
    const d = Math.hypot(farmer.x - x, (farmer.y - y) * 1.5);
    if (d < bestD) { bestD = d; best = { kind, idx, x, y }; }
  };
  const rows = rowsOwned();
  for (let i = 0; i < GRID; i++) {
    const { x, y } = spotScenePos(i);
    if (i >= state.plotsOwned) {
      if (Math.floor(i / COLS) < rows) consider(x, y, "buy", i);
      continue;
    }
    const p = state.plots[i];
    if (!p) consider(x, y, "plant", i);
    else if (Date.now() - p.plantedAt >= CROPS[p.crop].growMs) consider(x, y, "chop", i);
  }
  for (const c of customers) {
    consider(c.px, c.py, "sell", "c" + c.id);
  }
  return best;
}

let lastNear = null;
function updateNearHighlight(t) {
  const key = t ? t.kind + ":" + t.idx : "";
  if (key === lastNear) return;
  lastNear = key;
  for (const s of spotEls) s.el.classList.remove("near");
  for (const [, ce] of custEls) ce.el.classList.remove("near");
  const btn = $("actionBtn");
  if (!t) {
    btn.textContent = "🚶";
    btn.classList.add("idle");
    return;
  }
  btn.classList.remove("idle");
  btn.textContent =
    t.kind === "plant" ? CROPS[selectedSeed].emoji :
    t.kind === "chop"  ? "🪓" :
    t.kind === "sell"  ? "💰" : "🪧";
  if (t.kind === "sell") {
    const ce = custEls.get(Number(String(t.idx).slice(1)));
    if (ce) ce.el.classList.add("near");
  } else {
    spotEls[t.idx].el.classList.add("near");
  }
}

function doAction() {
  if (Date.now() < farmer.chopUntil) return;
  const t = nearestTarget();
  if (!t) return;
  if (t.kind === "plant") plantAt(t.idx);
  else if (t.kind === "chop") chopAt(t.idx);
  else if (t.kind === "sell") serve(Number(String(t.idx).slice(1)));
  else buyLand();
}

function walkToSpot(i) {
  const { x, y } = spotScenePos(i);
  farmer.target = { x, y: Math.min(Y_MAX, y + 3), spot: i };
}

const farmerEl = $("farmer");
function updateFarmer(dt) {
  const now = Date.now();
  let dx = 0, dy = 0;

  if (farmer.joy && (farmer.joy.dx || farmer.joy.dy)) {
    dx = farmer.joy.dx; dy = farmer.joy.dy;
    farmer.target = null;
  } else {
    const k = farmer.keys;
    if (k.has("left")) dx -= 1;
    if (k.has("right")) dx += 1;
    if (k.has("up")) dy -= 1;
    if (k.has("down")) dy += 1;
    if (dx || dy) farmer.target = null;
    else if (farmer.target) {
      const tx = farmer.target.x - farmer.x, ty = farmer.target.y - farmer.y;
      const dist = Math.hypot(tx, ty * 1.5);
      if (dist < 2.2) {
        const arrived = farmer.target;
        farmer.target = null;
        if (arrived.spot !== undefined) doAction();
      } else {
        dx = tx; dy = ty;
      }
    }
  }

  const mag = Math.hypot(dx, dy);
  const moving = mag > 0.01 && now >= farmer.chopUntil;
  if (moving) {
    dx /= mag; dy /= mag;
    // joystick gives analog speed: gentle drags walk, bigger drags run
    const throttle = farmer.joy ? Math.min(1, mag) : 1;
    farmer.x += dx * SPEED_X * throttle * dt;
    farmer.y += dy * SPEED_Y * throttle * dt;
    farmer.x = Math.max(2, Math.min(98, farmer.x));
    farmer.y = Math.max(Y_MIN, Math.min(Y_MAX, farmer.y));
    if (dx > 0.1) farmer.facing = 1;
    if (dx < -0.1) farmer.facing = -1;
  }

  const s = farmerScale(farmer.y);
  farmerEl.style.left = farmer.x + "%";
  farmerEl.style.top = farmer.y + "%";
  farmerEl.style.zIndex = Math.round(farmer.y * 10) + 1;
  farmerEl.style.transform = `translate(-50%, -94%) scale(${(s * farmer.facing).toFixed(3)}, ${s.toFixed(3)})`;
  farmerEl.classList.toggle("walking", moving);
  farmerEl.classList.toggle("chopping", now < farmer.chopUntil);

  updateNearHighlight(nearestTarget());
}

// ---------------- Customers: real people at the stand ----------------
const custEls = new Map();   // id -> { el, barFill }

function buildCustomerEl(cust) {
  const c = CROPS[cust.crop];
  const el = document.createElement("div");
  el.className = "cust moving";
  el.innerHTML = `
    <div class="cin">
      <div class="bubble">${cust.qty}× ${c.emoji} <b>$${c.sell * cust.qty}</b><span class="pbar"><span></span></span></div>
      <div class="cshadow"></div>
      <span class="cbody">${cust.face}</span>
    </div>`;
  el.addEventListener("click", (ev) => { ev.stopPropagation(); serve(cust.id); });
  $("scene").appendChild(el);
  custEls.set(cust.id, { el, barFill: el.querySelector(".pbar span") });
  return el;
}

// called on the slow tick: create/remove customer elements, refresh bubbles
function renderCustomers() {
  const now = Date.now();
  for (const [id, ce] of custEls) {
    if (!customers.some(c => c.id === id) && !ce.el.classList.contains("leaving")) {
      ce.el.classList.add("leaving");
      setTimeout(() => { ce.el.remove(); custEls.delete(id); }, 500);
    }
  }
  for (const cust of customers) {
    let ce = custEls.get(cust.id);
    if (!ce) { buildCustomerEl(cust); ce = custEls.get(cust.id); }
    const left = Math.max(0, 1 - (now - cust.arrivedAt) / PATIENCE_MS);
    ce.barFill.style.width = (left * 100) + "%";
    ce.barFill.style.background = left < 0.3 ? "#ef5350" : left < 0.6 ? "#ffa726" : "#66bb6a";
    ce.el.classList.toggle("can-sell", (state.barn[cust.crop] || 0) >= cust.qty);
  }
}

// called every frame: walk customers to their place in the queue
function moveCustomers(dt) {
  customers.forEach((cust, qi) => {
    const ce = custEls.get(cust.id);
    if (!ce) return;
    const slot = QUEUE_SLOTS[Math.min(qi, QUEUE_SLOTS.length - 1)];
    const dx = slot.x - cust.px, dy = slot.y - cust.py;
    const dist = Math.hypot(dx, dy);
    const moving = dist > 0.6;
    if (moving) {
      const step = Math.min(dist, 24 * dt);
      cust.px += dx / dist * step;
      cust.py += dy / dist * step;
    }
    const s = farmerScale(Math.min(cust.py, Y_MAX)) * 0.92;
    ce.el.style.left = cust.px + "%";
    ce.el.style.top = cust.py + "%";
    ce.el.style.zIndex = Math.round(cust.py * 10);
    ce.el.style.transform = `translate(-50%, -96%) scale(${s.toFixed(3)})`;
    ce.el.classList.toggle("moving", moving);
  });
}

// ---------------- Rendering (header / shop) ----------------
function renderHeader() {
  $("money").textContent = "$" + state.money;
  const inv = $("barnInv");
  inv.innerHTML = "";
  const entries = Object.entries(state.barn).filter(([, n]) => n > 0);
  if (entries.length === 0) {
    inv.innerHTML = '<span class="item">🧺 empty</span>';
  } else {
    for (const [crop, n] of entries) {
      const d = document.createElement("span");
      d.className = "item";
      d.textContent = `${CROPS[crop].emoji}×${n}`;
      inv.appendChild(d);
    }
  }
}

function renderSeeds() {
  const wrap = $("seeds");
  wrap.innerHTML = "";
  for (const [key, c] of Object.entries(CROPS)) {
    const locked = state.plotsOwned < c.unlockPlots;
    const btn = document.createElement("button");
    btn.className = "seed-btn" + (key === selectedSeed ? " selected" : "") + (locked ? " locked" : "");
    btn.title = locked ? `${c.name} — own ${c.unlockPlots} plots to unlock` : `${c.name} — plant $${c.cost}, sells $${c.sell}`;
    btn.innerHTML = locked
      ? `<span class="big">🔒</span>${c.unlockPlots} plots`
      : `<span class="big">${c.emoji}</span>$${c.cost}`;
    btn.onclick = () => {
      if (locked) { sndNope(); toast(`Own ${c.unlockPlots} plots to unlock ${c.name}!`); return; }
      selectedSeed = key;
      lastNear = "?";        // refresh the action button icon
      renderSeeds();
    };
    wrap.appendChild(btn);
  }
  // buy-land button lives on the shelf too, so it never covers the farm
  const landBtn = document.createElement("button");
  landBtn.id = "landBtn";
  landBtn.className = "land-btn" + (state.plotsOwned >= GRID ? " sold-out" : "");
  landBtn.title = "Buy the next plot of land (or walk to the weeds)";
  landBtn.innerHTML = `<span class="big">🪧</span><b>$${landPrice()}</b>`;
  landBtn.onclick = () => buyLand();
  wrap.appendChild(landBtn);
}

function renderAll() {
  renderHeader();
  renderSeeds();
  updateField();
  renderCustomers();
}

// ---------------- Actions ----------------
function plantAt(i) {
  const c = CROPS[selectedSeed];
  if (state.plotsOwned < c.unlockPlots) return;
  if (state.money < c.cost) {
    sndNope();
    toast(`Need $${c.cost} to plant ${c.name}!`);
    return;
  }
  state.money -= c.cost;
  state.plots[i] = { crop: selectedSeed, plantedAt: Date.now() };
  sndPlant();
  const { x, y } = spotScenePos(i);
  sceneFloater(`-$${c.cost}`, x, y, "#c62828");
  lastNear = "?";
  save();
  renderHeader();
  updateField();
}

function chopAt(i) {
  const p = state.plots[i];
  if (!p) return;
  const c = CROPS[p.crop];
  if (Date.now() - p.plantedAt < c.growMs) return;

  // face the crop and swing the axe
  const { x, y } = spotScenePos(i);
  farmer.facing = x >= farmer.x ? 1 : -1;
  farmer.chopUntil = Date.now() + 340;
  farmerEl.classList.remove("chopping");
  void farmerEl.offsetWidth;
  sndChop();

  if (p.chopsLeft === undefined) p.chopsLeft = c.chops;
  p.chopsLeft--;

  const s = spotEls[i];
  if (p.chopsLeft > 0) {
    // wobble but stay standing
    if (s.plantEl) {
      s.plantEl.classList.remove("shake");
      void s.plantEl.offsetWidth;
      s.plantEl.classList.add("shake");
    }
    save();
    return;
  }

  // timber! the crop falls and goes in the barn
  state.plots[i] = null;
  state.barn[p.crop] = (state.barn[p.crop] || 0) + 1;
  const ghost = document.createElement("div");
  ghost.className = "chopped";
  ghost.textContent = c.emoji;
  ghost.style.left = x + "%";
  ghost.style.top = y + "%";
  ghost.style.fontSize = Math.round(34 * s.scale) + "px";
  $("scene").appendChild(ghost);
  setTimeout(() => ghost.remove(), 700);
  sndHarvest();
  sceneFloater(`+1 ${c.emoji}`, x, y);
  lastNear = "?";
  save();
  renderHeader();
  updateField();
  renderCustomers();
}

function serve(id) {
  const idx = customers.findIndex(c => c.id === id);
  if (idx === -1) return;
  const cust = customers[idx];
  const c = CROPS[cust.crop];
  if ((state.barn[cust.crop] || 0) < cust.qty) {
    sndNope();
    toast(`${cust.face} wants ${cust.qty}× ${c.emoji} — you don't have enough yet!`);
    return;
  }
  const total = c.sell * cust.qty;
  state.barn[cust.crop] -= cust.qty;
  state.money += total;
  customers.splice(idx, 1);
  sndSell();
  popMoney();
  sceneFloater(`+$${total}`, cust.px, cust.py - 8, "#f9a825");
  toast(`${cust.face} "Thank you!" +$${total}`);
  lastNear = "?";
  save();
  renderHeader();
  renderCustomers();
}

function buyLand() {
  const price = landPrice();
  if (state.money < price) {
    sndNope();
    toast(`Need $${price} for more land!`);
    return;
  }
  state.money -= price;
  state.plotsOwned++;
  sndBuy();
  toast(`🎉 New plot! You now own ${state.plotsOwned} plots.`);
  for (const c of Object.values(CROPS)) {
    if (c.unlockPlots === state.plotsOwned) {
      toast(`🌟 New seed unlocked: ${c.emoji} ${c.name}!`);
    }
  }
  lastNear = "?";
  save();
  renderHeader();
  renderSeeds();
  updateField();
}

// ---------------- Customer arrivals ----------------
function scheduleNextCustomer() {
  nextCustomerAt = Date.now() + 9000 + Math.random() * 11000;
}

function spawnCustomer() {
  const options = unlockedCrops();
  // customers prefer cheaper crops so early game stays winnable
  const weighted = [];
  options.forEach((k, idx) => {
    const weight = Math.max(1, options.length - idx);
    for (let j = 0; j < weight; j++) weighted.push(k);
  });
  const crop = weighted[Math.floor(Math.random() * weighted.length)];
  const qty = 1 + Math.floor(Math.random() * 3);
  customers.push({
    id: ++customerId,
    face: FACES[Math.floor(Math.random() * FACES.length)],
    crop,
    qty,
    arrivedAt: Date.now(),
    px: 106, py: 99,         // walks in from the bottom-right corner
  });
}

// ---------------- Game loop ----------------
function tick() {
  const now = Date.now();

  if (customers.length < MAX_QUEUE && now >= nextCustomerAt) {
    spawnCustomer();
    scheduleNextCustomer();
  }

  customers = customers.filter(c => {
    if (now - c.arrivedAt > PATIENCE_MS) {
      toast(`${c.face} got tired of waiting and left…`);
      return false;
    }
    return true;
  });

  // rescue: if totally broke with nothing growing and nothing in the barn,
  // grandma slips you a few dollars so the game can't get stuck
  const cheapest = Math.min(...Object.values(CROPS).map(c => c.cost));
  const growing = state.plots.some(p => p);
  const stored = Object.values(state.barn).some(n => n > 0);
  if (state.money < cheapest && !growing && !stored) {
    state.money += 5;
    toast("👵 Grandma slips you $5. \"Go plant something, dear!\"");
    save();
    renderHeader();
  }

  updateField();
  renderCustomers();
}

// farmer + customers move at full frame rate
let lastFrame = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastFrame) / 1000);
  lastFrame = t;
  updateFarmer(dt);
  moveCustomers(dt);
  requestAnimationFrame(frame);
}

// ---------------- Input ----------------
const KEYMAP = {
  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  a: "left", d: "right", w: "up", s: "down",
  A: "left", D: "right", W: "up", S: "down",
};
window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "e" || e.key === "E" || e.key === "Enter") {
    if (document.activeElement && document.activeElement.tagName === "BUTTON" && e.key !== " ") return;
    e.preventDefault();
    doAction();
    return;
  }
  const dir = KEYMAP[e.key];
  if (dir) { e.preventDefault(); farmer.keys.add(dir); }
});
window.addEventListener("keyup", (e) => {
  const dir = KEYMAP[e.key];
  if (dir) farmer.keys.delete(dir);
});
window.addEventListener("blur", () => farmer.keys.clear());

// touch joystick: press anywhere on the scene (not a button/customer) and drag
const sceneEl = $("scene");
const stickEl = $("stick");
const knobEl = $("knob");

sceneEl.addEventListener("touchstart", (e) => {
  if (e.target.closest(".action-btn, .cust")) return;
  const r = sceneEl.getBoundingClientRect();
  for (const t of e.changedTouches) {
    if (farmer.joy === null) {
      e.preventDefault();
      farmer.joy = { id: t.identifier, ox: t.clientX, oy: t.clientY, dx: 0, dy: 0 };
      stickEl.style.display = "block";
      stickEl.style.left = (t.clientX - r.left) + "px";
      stickEl.style.top = (t.clientY - r.top) + "px";
      knobEl.style.transform = "translate(0,0)";
    }
  }
}, { passive: false });

sceneEl.addEventListener("touchmove", (e) => {
  if (!farmer.joy) return;
  const r = sceneEl.getBoundingClientRect();
  for (const t of e.changedTouches) {
    if (t.identifier === farmer.joy.id) {
      e.preventDefault();
      const R = 40;          // knob travel
      const FULL = 22;       // deflection that already counts as full speed
      let dx = t.clientX - farmer.joy.ox;
      let dy = t.clientY - farmer.joy.oy;
      let m = Math.hypot(dx, dy);
      // floating stick: if the thumb overshoots, the base follows it,
      // so changing direction never requires dragging all the way back
      if (m > R) {
        farmer.joy.ox = t.clientX - dx / m * R;
        farmer.joy.oy = t.clientY - dy / m * R;
        dx = dx / m * R; dy = dy / m * R;
        m = R;
        stickEl.style.left = (farmer.joy.ox - r.left) + "px";
        stickEl.style.top = (farmer.joy.oy - r.top) + "px";
      }
      knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
      const dead = 4;
      if (m < dead) {
        farmer.joy.dx = 0; farmer.joy.dy = 0;
      } else {
        const speed = Math.min(1, m / FULL);   // full speed on a small drag
        farmer.joy.dx = dx / m * speed;
        farmer.joy.dy = dy / m * speed;
      }
    }
  }
}, { passive: false });

function endJoy(e) {
  if (!farmer.joy) return;
  for (const t of e.changedTouches) {
    if (t.identifier === farmer.joy.id) {
      farmer.joy = null;
      stickEl.style.display = "none";
    }
  }
}
sceneEl.addEventListener("touchend", endJoy);
sceneEl.addEventListener("touchcancel", endJoy);

// tap/click the grass to walk there
sceneEl.addEventListener("click", (e) => {
  if (e.target.closest(".action-btn, .spot, .cust")) return;
  const r = sceneEl.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 100;
  const y = (e.clientY - r.top) / r.height * 100;
  if (y < Y_MIN - 4) return;   // clicked the sky
  farmer.target = { x: Math.max(2, Math.min(98, x)), y: Math.max(Y_MIN, Math.min(Y_MAX, y)) };
});

$("actionBtn").addEventListener("pointerdown", (e) => { e.preventDefault(); doAction(); });

// ---------------- Boot ----------------
$("reset").onclick = () => {
  if (confirm("Start a brand new farm? Your progress will be lost.")) {
    localStorage.removeItem(SAVE_KEY);
    state = freshState();
    for (const [, ce] of custEls) ce.el.remove();
    custEls.clear();
    customers = [];
    selectedSeed = "wheat";
    for (const s of spotEls) { s.sig = ""; s.plantbox.innerHTML = ""; s.plantEl = null; }
    lastNear = "?";
    scheduleNextCustomer();
    renderAll();
    toast("🌅 A fresh start on a tiny farm!");
  }
};

state = load() || freshState();
buildField();
scheduleNextCustomer();
renderAll();
toast("🌾 Welcome! Grow crops, chop them down, and sell to the folks at your stand.");
setInterval(tick, 400);
requestAnimationFrame(frame);
</script>
</body>
</html>
